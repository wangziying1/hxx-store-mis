Pages._generateAIAnswer = function(question) {
  const q = question.toLowerCase();
  const sales = DB.get('dailySales', []);
  const expenses = DB.get('expenses', []);
  const purchases = DB.get('purchases', []);
  const inv = DB.get('inventory', []);

  // 今天为什么利润低？
  if (q.includes('利润') && (q.includes('低') || q.includes('下降') || q.includes('少') || q.includes('为什么'))) {
    return AIBrain.analyzeProfitDrop(sales, expenses, purchases);
  }

  // 采购建议
  if (q.includes('采购') || q.includes('进货') || q.includes('补货')) {
    return AIBrain.purchaseSuggestion(inv, purchases);
  }

  // 这个月经营情况
  if ((q.includes('这') || q.includes('本')) && (q.includes('月') || q.includes('经营') || q.includes('情况'))) {
    return AIBrain.monthlySummary(sales, expenses, purchases);
  }

  // 成本分析
  if (q.includes('成本') && (q.includes('高') || q.includes('偏') || q.includes('分析') || q.includes('哪些'))) {
    return AIBrain.costAnalysis(expenses, purchases);
  }

  // 库存问题
  if (q.includes('库存')) {
    return AIBrain.inventoryAnalysis(inv);
  }

  // 平台分析
  if (q.includes('平台') || q.includes('美团') || q.includes('外卖')) {
    return AIBrain.platformAnalysis(sales);
  }

  // 提醒
  if (q.includes('提醒') || q.includes('注意') || q.includes('待办')) {
    return AIBrain.alertsSummary();
  }

  // 经营建议
  if (q.includes('建议') || q.includes('推荐') || q.includes('怎么办') || q.includes('如何')) {
    return AIBrain.businessAdvice(sales, expenses, purchases, inv);
  }

  // 营业额
  if (q.includes('营业') || q.includes('收入') || q.includes('赚')) {
    return AIBrain.revenueSummary(sales);
  }

  // 默认回复
  return `我理解你问的是「${question}」。\n\n我目前可以帮你分析以下方面：\n\n📊 **利润分析** - 为什么利润低\n📋 **采购建议** - 下周需要采购什么\n📆 **月度总结** - 这个月经营情况\n💸 **成本分析** - 哪些成本偏高\n🏪 **库存诊断** - 库存有什么问题\n📱 **平台对比** - 哪个平台最好\n🔔 **提醒汇总** - 有什么需要注意的\n💡 **经营建议** - 改善建议\n\n请尝试上面的提问方式，或者点击上方的快捷问题。`;
};

/* ===== AI 大脑 - 分析引擎 ===== */
const AIBrain = {
  analyzeProfitDrop(sales, expenses, purchases) {
    const today = Utils.today();
    const yesterday = Utils.formatDate(Utils.addDays(today, -1));

    const todaySales = sales.filter(s => s.date === today);
    const yestSales = sales.filter(s => s.date === yesterday);
    const todayRevenue = todaySales.reduce((s, x) => s + (x.totalRevenue || 0), 0);
    const yestRevenue = yestSales.reduce((s, x) => s + (x.totalRevenue || 0), 0);

    const todayExp = expenses.filter(e => e.date === today);
    const yestExp = expenses.filter(e => e.date === yesterday);
    const todayExpTotal = todayExp.reduce((s, e) => s + (e.amount || 0), 0);
    const yestExpTotal = yestExp.reduce((s, e) => s + (e.amount || 0), 0);

    const todayProfit = todayRevenue * 0.65 - todayExpTotal;
    const yestProfit = yestRevenue * 0.65 - yestExpTotal;
    const diff = todayProfit - yestProfit;

    if (todayRevenue === 0 && yestRevenue === 0) {
      return '⚠️ 今天和昨天都没有营业数据，请先记录营业数据。';
    }

    let result = `📊 **利润分析报告**\n\n`;
    result += `📅 今日利润：¥${Utils.money(todayProfit)}\n`;
    result += `📅 昨日利润：¥${Utils.money(yestProfit)}\n`;
    result += `📈 利润变化：${diff >= 0 ? '+' : ''}¥${Utils.money(diff)}\n\n`;

    if (diff >= 0) {
      result += `✅ **今日利润比昨天${diff > 0 ? '增加' : '持平'}了！**\n\n`;
      result += `**主要原因：**\n`;
      if (todayRevenue > yestRevenue) result += `• 营业额增加 ¥${Utils.money(todayRevenue - yestRevenue)}（+${((todayRevenue-yestRevenue)/Math.max(yestRevenue,1)*100).toFixed(1)}%）\n`;
      if (todayExpTotal < yestExpTotal) result += `• 支出减少 ¥${Utils.money(yestExpTotal - todayExpTotal)}\n`;
    } else {
      result += `⚠️ **今日利润比昨天下降了 ¥${Utils.money(Math.abs(diff))}**\n\n`;
      result += `**主要原因分析：**\n`;

      if (todayRevenue < yestRevenue) {
        const revDrop = yestRevenue - todayRevenue;
        result += `• 📉 营业额减少 ¥${Utils.money(revDrop)}（-${(revDrop/Math.max(yestRevenue,1)*100).toFixed(1)}%）\n`;
      }
      if (todayExpTotal > yestExpTotal) {
        const expRise = todayExpTotal - yestExpTotal;
        result += `• 📈 支出增加 ¥${Utils.money(expRise)}\n`;

        // 分析哪些支出增加了
        const todayExpByCat = {};
        const yestExpByCat = {};
        todayExp.forEach(e => { todayExpByCat[e.category] = (todayExpByCat[e.category] || 0) + (e.amount || 0); });
        yestExp.forEach(e => { yestExpByCat[e.category] = (yestExpByCat[e.category] || 0) + (e.amount || 0); });
        const cats = Object.keys({ ...todayExpByCat, ...yestExpByCat });
        cats.forEach(cat => {
          const diff = (todayExpByCat[cat] || 0) - (yestExpByCat[cat] || 0);
          if (diff > 0) result += `  └ ${cat}增加 ¥${Utils.money(diff)}\n`;
        });
      }

      const todayPur = purchases.filter(p => p.purchaseDate === today).reduce((s, p) => s + (p.totalAmount || 0), 0);
      const yestPur = purchases.filter(p => p.purchaseDate === yesterday).reduce((s, p) => s + (p.totalAmount || 0), 0);
      if (todayPur > yestPur) {
        result += `• 📦 采购增加 ¥${Utils.money(todayPur - yestPur)}\n`;
      }

      result += `\n**建议措施：**\n`;
      result += `• 检查营业额下降原因（天气、客流、平台流量等）\n`;
      result += `• 控制不必要的支出\n`;
      result += `• 优化采购计划，减少浪费\n`;
    }

    return result;
  },

  purchaseSuggestion(inv, purchases) {
    const needPurchase = inv.filter(i => i.safeStock && i.quantity <= i.safeStock);
    const expiring = purchases.filter(p => {
      if (!p.expiryDate) return false;
      const days = Utils.daysBetween(Utils.today(), p.expiryDate);
      return days >= 0 && days <= 3;
    });

    let result = `📋 **采购建议报告**\n\n`;

    if (needPurchase.length === 0 && expiring.length === 0) {
      result += `✅ 当前库存充足，暂无紧急采购需求。\n\n建议保持常规补货节奏即可。`;
      return result;
    }

    if (needPurchase.length > 0) {
      result += `⚠️ **以下 ${needPurchase.length} 项库存不足，建议尽快采购：**\n\n`;
      let totalAmount = 0;
      needPurchase.forEach(i => {
        const suggestQty = Math.ceil(Math.max(i.safeStock * 2 - i.quantity, i.safeStock) * 10) / 10;
        const amount = suggestQty * (i.purchasePrice || 0);
        totalAmount += amount;
        result += `• **${i.name}** - 当前: ${i.quantity}${i.unit||''} | 安全线: ${i.safeStock}${i.unit||''} | 建议采购: ${suggestQty}${i.unit||''} | 预计: ¥${Utils.money(amount)}\n`;
      });
      result += `\n💰 **预计采购总金额：¥${Utils.money(totalAmount)}**\n`;
    }

    if (expiring.length > 0) {
      result += `\n⏰ **以下食品即将过期，建议尽快使用或补充：**\n\n`;
      expiring.forEach(p => {
        const days = Utils.daysBetween(Utils.today(), p.expiryDate);
        result += `• **${p.name}** - 剩余 ${p.quantity}${p.unit||''} | ${days}天后过期\n`;
      });
    }

    result += `\n💡 建议根据近7天销售情况调整采购量，避免浪费。`;
    return result;
  },

  monthlySummary(sales, expenses, purchases) {
    const monthSales = sales.filter(s => Utils.isThisMonth(s.date));
    const monthExp = expenses.filter(e => Utils.isThisMonth(e.date));
    const monthPur = purchases.filter(p => Utils.isThisMonth(p.purchaseDate));

    const revenue = monthSales.reduce((s, x) => s + (x.totalRevenue || 0), 0);
    const expTotal = monthExp.reduce((s, e) => s + (e.amount || 0), 0);
    const purTotal = monthPur.reduce((s, p) => s + (p.totalAmount || 0), 0);
    const grossProfit = revenue * 0.65;
    const netProfit = grossProfit - expTotal;
    const orderCount = monthSales.reduce((s, x) => s + (x.orderCount || 0), 0);
    const avgPrice = orderCount > 0 ? revenue / orderCount : 0;

    const now = new Date();
    const dayOfMonth = now.getDate();

    let result = `📆 **${now.getFullYear()}年${now.getMonth()+1}月经营月报**\n\n`;
    result += `**核心数据：**\n`;
    result += `• 营业额：¥${Utils.money(revenue)}（日均¥${Utils.money(revenue/Math.max(dayOfMonth,1))}）\n`;
    result += `• 订单数：${orderCount} 单\n`;
    result += `• 客单价：¥${Utils.money(avgPrice)}\n`;
    result += `• 毛利润：¥${Utils.money(grossProfit)}（毛利率65%）\n`;
    result += `• 净利润：¥${Utils.money(netProfit)}\n`;
    result += `• 总支出：¥${Utils.money(expTotal + purTotal)}\n\n`;

    // 支出分类
    const expByCat = {};
    monthExp.forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + (e.amount || 0); });

  costAnalysis(expenses, purchases) {
    const monthExp = expenses.filter(e => Utils.isThisMonth(e.date));
    const monthPur = purchases.filter(p => Utils.isThisMonth(p.purchaseDate));
    const purTotal = monthPur.reduce((s, p) => s + (p.totalAmount || 0), 0);

    const expByCat = {};
    monthExp.forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + (e.amount || 0); });

    const allCosts = [...Object.entries(expByCat), ['食材采购', purTotal]].sort((a,b) => b[1]-a[1]);
    const totalCost = allCosts.reduce((s, c) => s + c[1], 0);

    let result = `💸 **本月成本分析报告**\n\n`;
    result += `总成本：¥${Utils.money(totalCost)}\n\n`;
    result += `**成本排行（从高到低）：**\n\n`;

    allCosts.forEach(([cat, amt], i) => {
      const pct = totalCost > 0 ? (amt/totalCost*100).toFixed(1) : 0;
      const bar = '█'.repeat(Math.round(pct/5)) + '░'.repeat(20 - Math.round(pct/5));
      result += `${i+1}. **${cat}** ¥${Utils.money(amt)} (${pct}%) ${bar}\n`;
    });

    // 建议
    result += `\n**💡 优化建议：**\n`;
    if (allCosts[0] && allCosts[0][0] === '食材采购') {
      result += `• 食材采购占比最高，建议：\n  - 与供应商议价或比价\n  - 减少损耗浪费\n  - 优化菜品配方\n`;
    }
    if (expByCat['工资'] && expByCat['工资'] / Math.max(totalCost, 1) > 0.25) {
      result += `• 人工成本偏高，建议优化排班，高峰期增加兼职\n`;
    }
    if ((expByCat['平台推广'] || 0) + (expByCat['广告'] || 0) > 0) {
      result += `• 推广费用需关注ROI，评估各平台转化效果\n`;
    }

    return result;
  },

  inventoryAnalysis(inv) {
    const lowStock = inv.filter(i => i.safeStock && i.quantity <= i.safeStock);
    const totalValue = inv.reduce((s, i) => s + (i.quantity || 0) * (i.purchasePrice || 0), 0);

    let result = `🏪 **库存分析报告**\n\n`;
    result += `• 库存种类：${inv.length} 种\n`;
    result += `• 库存总值：¥${Utils.money(totalValue)}\n`;
    result += `• 库存不足：${lowStock.length} 项\n\n`;

    if (lowStock.length > 0) {
      result += `⚠️ **库存预警：**\n\n`;
      lowStock.forEach(i => {
        result += `• **${i.name}** - 当前 ${i.quantity}${i.unit||''} / 安全线 ${i.safeStock}${i.unit||''} 🔴\n`;
      });
      result += `\n建议尽快补货，可前往「采购计划」页面查看建议采购量。`;
    } else {
      result += `✅ 所有库存都在安全线以上，状态良好！`;
    }

    return result;
  },

  platformAnalysis(sales) {
    const platforms = {};
    sales.forEach(s => {
      platforms['美团'] = (platforms['美团'] || 0) + (s.meituan || 0);
      platforms['淘宝'] = (platforms['淘宝'] || 0) + (s.taobao || 0);
      platforms['京东'] = (platforms['京东'] || 0) + (s.jd || 0);
      platforms['堂食'] = (platforms['堂食'] || 0) + (s.dineIn || 0);
    });

    const entries = Object.entries(platforms).filter(([k,v]) => v > 0).sort((a,b) => b[1]-a[1]);
    if (entries.length === 0) return '暂无平台数据，请先记录营业数据。';

    const total = entries.reduce((s, e) => s + e[1], 0);
    let result = `📱 **平台收入分析**\n\n`;
    result += `总收入：¥${Utils.money(total)}\n\n`;
    result += `**平台排行：**\n\n`;

    entries.forEach(([p, amt], i) => {
      const pct = (amt/total*100).toFixed(1);
      const bar = '█'.repeat(Math.round(pct/5)) + '░'.repeat(20-Math.round(pct/5));
      result += `${i+1}. **${p}** ¥${Utils.money(amt)} (${pct}%) ${bar}\n`;
    });

    result += `\n💡 **${entries[0][0]}** 是目前表现最好的平台，占比${(entries[0][1]/total*100).toFixed(1)}%。`;
    if (entries[0][0] === '美团') {
      result += `建议继续维护好美团运营，同时关注其他平台的增长空间。`;
    } else if (entries[0][0] === '堂食') {
      result += `堂食表现好，说明门店位置和口碑不错。可以考虑加强外卖平台推广。`;
    }

    return result;
  },

  alertsSummary() {
    const alerts = AlertCenter.getAllAlerts();
    if (alerts.length === 0) return '✅ 当前没有需要处理的提醒事项，一切正常！';

    const groups = {};
    alerts.forEach(a => { if (!groups[a.type]) groups[a.type] = []; groups[a.type].push(a); });

    const typeNames = { food: '🍎 食品过期', inventory: '📦 库存不足', license: '📋 证照到期', payment: '💵 付款提醒', equipment: '🔧 设备保养', foodSafety: '🛡️ 食品安全' };

    let result = `🔔 **提醒汇总（共${alerts.length}项）**\n\n`;
    Object.entries(groups).forEach(([type, items]) => {
      result += `**${typeNames[type] || type}（${items.length}项）：**\n`;
      items.forEach(a => { result += `• ${a.title} - ${a.desc}\n`; });
      result += '\n';
    });

    result += `请及时处理以上事项，避免影响正常经营。`;
    return result;
  },

  businessAdvice(sales, expenses, purchases, inv) {
    const monthSales = sales.filter(s => Utils.isThisMonth(s.date));
    const revenue = monthSales.reduce((s, x) => s + (x.totalRevenue || 0), 0);
    const monthExp = expenses.filter(e => Utils.isThisMonth(e.date));
    const expTotal = monthExp.reduce((s, e) => s + (e.amount || 0), 0);
    const netProfit = revenue * 0.65 - expTotal;

    let result = `💡 **经营建议报告**\n\n`;

    // 利润率分析
    const profitRate = revenue > 0 ? (netProfit / revenue * 100) : 0;
    result += `**1. 利润率分析**\n`;
    result += `当前净利润率：${profitRate.toFixed(1)}%\n`;
    if (profitRate > 20) result += `✅ 利润率优秀，继续保持！\n\n`;
    else if (profitRate > 10) result += `📊 利润率正常，仍有优化空间\n\n`;
    else if (profitRate > 0) result += `⚠️ 利润率偏低，需要关注成本控制\n\n`;
    else result += `🔴 处于亏损状态，需要紧急调整经营策略\n\n`;

    // 成本结构建议
    const expByCat = {};
    monthExp.forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + (e.amount || 0); });
    result += `**2. 成本优化建议**\n`;
    if (expByCat['工资'] / Math.max(revenue, 1) > 0.2) result += `• 人工成本占比${(expByCat['工资']/Math.max(revenue,1)*100).toFixed(0)}%偏高，建议优化排班\n`;
    if ((expByCat['平台推广'] || 0) / Math.max(revenue, 1) > 0.1) result += `• 推广费用较高，建议关注各平台ROI\n`;
    if ((expByCat['水电'] || 0) > 2000) result += `• 水电费较高，建议节约能源\n`;
    result += '\n';

    // 库存建议
    const lowStock = inv.filter(i => i.safeStock && i.quantity <= i.safeStock);
    result += `**3. 库存管理**\n`;
    if (lowStock.length > 0) {
      result += `⚠️ 有${lowStock.length}项库存不足，建议及时补货\n`;
    } else {
      result += `✅ 库存充足\n`;
    }
    result += '\n';

    // 菜品建议
    const productSales = {};
    monthSales.forEach(s => { if (s.products) s.products.forEach(p => { productSales[p.name] = (productSales[p.name] || 0) + (p.quantity || 0); }); });
    const topProducts = Object.entries(productSales).sort((a,b) => b[1]-a[1]);
    if (topProducts.length > 0) {
      result += `**4. 菜品策略**\n`;
      result += `• 热销菜品：${topProducts.slice(0,3).map(p => p[0]).join('、')}\n`;
      result += `• 建议重点保障热销菜的食材供应\n`;
      if (topProducts.length > 5) result += `• 长尾菜品可考虑优化精简\n`;
      result += '\n';
    }

    result += `**5. 综合建议**\n`;
    result += `• 持续监控每日营业数据，及时发现问题\n`;
    result += `• 定期检查食品安全台账，确保合规\n`;
    result += `• 关注天气和节假日对客流的影响\n`;
    result += `• 维护好各平台评价，及时处理差评`;

    return result;
  },

  revenueSummary(sales) {
    const today = Utils.today();
    const todayRevenue = sales.filter(s => s.date === today).reduce((s, x) => s + (x.totalRevenue || 0), 0);
    const monthRevenue = sales.filter(s => Utils.isThisMonth(s.date)).reduce((s, x) => s + (x.totalRevenue || 0), 0);
    const yearRevenue = sales.filter(s => new Date(s.date).getFullYear() === new Date().getFullYear()).reduce((s, x) => s + (x.totalRevenue || 0), 0);

    let result = `💰 **营业额汇总**\n\n`;
    result += `• 今日：¥${Utils.money(todayRevenue)}\n`;
    result += `• 本月：¥${Utils.money(monthRevenue)}\n`;
    result += `• 本年：¥${Utils.money(yearRevenue)}\n`;

    // 近7天平均
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = Utils.formatDate(Utils.addDays(today, -i));
      last7.push(sales.filter(s => s.date === d).reduce((s, x) => s + (x.totalRevenue || 0), 0));
    }
    const avg7 = last7.reduce((a,b) => a+b, 0) / 7;
    result += `• 近7天日均：¥${Utils.money(avg7)}\n`;

    // 趋势
    if (last7[6] > avg7) result += `\n📈 今日营业额高于近7天平均水平，表现不错！`;
    else if (last7[6] < avg7 * 0.8) result += `\n📉 今日营业额低于平均水平，需要关注原因。`;
    else result += `\n📊 今日营业额与平均水平基本持平。`;

    return result;
  }
};

Pages._showDataMenu = function() {
  UI.modal('数据管理', `

      <button class="btn btn-danger btn-block" onclick="Pages._clearAllData()">🗑️ 清空所有数据</button>
    </div>
  `, `<button class="btn btn-default" onclick="UI.closeModal()">关闭</button>`);

  const tables = ['dailySales','expenses','incomes','purchases','suppliers','inventory','employees','foodSafety','equipment','contracts','licenses','complaints','badReviews','cashflow'];
  const overview = document.getElementById('dataOverview');
  overview.innerHTML = tables.map(t => {
    const count = DB.get(t, []).length;
    const names = { dailySales:'营业记录', expenses:'支出记录', incomes:'收入记录', purchases:'进货记录', suppliers:'供应商', inventory:'库存', employees:'员工', foodSafety:'食安记录', equipment:'设备', contracts:'合同', licenses:'证照', complaints:'投诉', badReviews:'差评', cashflow:'现金流' };
    return `<div style="display:inline-block;margin:4px;padding:4px 10px;background:#fff;border-radius:6px;font-size:12px;">${names[t]||t}: <strong>${count}</strong></div>`;
  }).join('');
};

Pages._clearAllData = function() {
  UI.confirm('确定清空所有数据吗？此操作不可恢复！', () => {
    const tables = ['dailySales','expenses','incomes','purchases','suppliers','inventory','employees','foodSafety','equipment','contracts','licenses','complaints','badReviews','cashflow','settings'];
    tables.forEach(t => localStorage.removeItem(DB._prefix + t));
    UI.closeModal();
    toast('所有数据已清空', 'success');
    setTimeout(() => location.reload(), 1000);
  });
};
