/* ===== 进销存模块：进货台账、供应商、库存、采购计划 ===== */

/* ========== 食品进货台账 ========== */
Pages.purchases = function(container) {
  let purchases = DB.get('purchases', []);
  const suppliers = DB.get('suppliers', []);

  // 过滤
  const searchKey = container.dataset.search || '';
  const filterCat = container.dataset.filterCat || '';
  let filtered = purchases;
  if (searchKey) filtered = filtered.filter(p => p.name?.includes(searchKey) || p.supplier?.includes(searchKey));
  if (filterCat) filtered = filtered.filter(p => p.category === filterCat);

  // 按日期倒序
  filtered.sort((a, b) => (b.purchaseDate || '').localeCompare(a.purchaseDate || ''));

  const categories = ['肉类','蔬菜','调料','饮料','米粉','包装盒','餐具','耗材','其他'];

  // 统计
  const totalAmount = filtered.reduce((s, p) => s + (p.totalAmount || 0), 0);
  const expiringCount = filtered.filter(p => {
    if (!p.expiryDate) return false;
    const days = Utils.daysBetween(Utils.today(), p.expiryDate);
    return days >= 0 && days <= 7;
  }).length;
  const expiredCount = filtered.filter(p => {
    if (!p.expiryDate) return false;
    return Utils.daysBetween(Utils.today(), p.expiryDate) < 0;
  }).length;

  let html = `
    <div class="stat-grid">
      <div class="stat-card info"><div class="stat-icon">📦</div><div class="stat-label">进货记录</div><div class="stat-value">${filtered.length}<small> 笔</small></div></div>
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">总金额</div><div class="stat-value">¥${Utils.money(totalAmount)}</div></div>
      <div class="stat-card warning"><div class="stat-icon">⏰</div><div class="stat-label">即将过期</div><div class="stat-value">${expiringCount}<small> 项</small></div></div>
      <div class="stat-card danger"><div class="stat-icon">⚫</div><div class="stat-label">已过期</div><div class="stat-value">${expiredCount}<small> 项</small></div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📦 食品进货台账</div>
        <button class="btn btn-primary" onclick="Pages._editPurchase()">+ 新增进货</button>
      </div>
      <div class="search-bar">
        <input type="text" id="purchaseSearch" placeholder="搜索食品名称/供应商..." value="${searchKey}" oninput="Pages._searchPurchase(this.value)">
        <select id="purchaseCatFilter" onchange="Pages._filterPurchaseCat(this.value)">
          <option value="">全部分类</option>
          ${categories.map(c => `<option value="${c}" ${filterCat === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <button class="btn btn-default" onclick="Pages._exportPurchases()">📋 导出CSV</button>
      </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无进货记录</div></div>`;
  } else {
    html += `<div class="table-wrap"><table class="data-table"><thead><tr>
      <th>进货日期</th><th>食品名称</th><th>分类</th><th>规格</th><th>数量</th>
      <th>单价</th><th>金额</th><th>供应商</th><th>到期日期</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>`;
    filtered.forEach(p => {
      let status = '', badge = 'badge-success';
      if (p.expiryDate) {
        const days = Utils.daysBetween(Utils.today(), p.expiryDate);
        if (days < 0) { status = `已过期${Math.abs(days)}天`; badge = 'badge-danger'; }
        else if (days <= 1) { status = `${days}天后过期`; badge = 'badge-danger'; }
        else if (days <= 3) { status = `${days}天后过期`; badge = 'badge-warning'; }
        else if (days <= 7) { status = `${days}天后过期`; badge = 'badge-info'; }
        else { status = '正常'; badge = 'badge-success'; }
      }
      html += `<tr>
        <td>${p.purchaseDate || '-'}</td>
        <td class="font-bold">${p.name || '-'}</td>

Pages._calcPurchaseAmount = function() {
  const qty = parseFloat(document.querySelector('[name="quantity"]').value) || 0;
  const price = parseFloat(document.querySelector('[name="unitPrice"]').value) || 0;
  document.querySelector('[name="totalAmount"]').value = (qty * price).toFixed(2);
};

Pages._calcExpiry = function() {
  const prodDate = document.querySelector('[name="productionDate"]').value;
  const shelfLife = parseInt(document.querySelector('[name="shelfLife"]').value) || 0;
  if (prodDate && shelfLife) {
    document.querySelector('[name="expiryDate"]').value = Utils.calcExpiry(prodDate, shelfLife);
  }
};

Pages._savePurchase = function(id) {
  const form = document.querySelector('.modal-body');
  const data = {};
  form.querySelectorAll('[name]').forEach(el => {
    if (el.type === 'file') return;
    data[el.name] = el.value;
  });
  // 数值转换
  ['quantity','unitPrice','totalAmount','shelfLife'].forEach(k => { if (data[k]) data[k] = parseFloat(data[k]); });

  // 上传文件
  Object.keys(UI.uploadedFiles).forEach(key => {
    data[key] = UI.uploadedFiles[key];
  });

  if (!data.name) { toast('请填写食品名称', 'error'); return; }
  if (!data.purchaseDate) { toast('请选择进货日期', 'error'); return; }

  if (id) {
    DB.update('purchases', id, data);
    toast('进货记录已更新', 'success');
  } else {
    DB.add('purchases', data);
    toast('进货记录已添加', 'success');
    // 自动更新库存
    Pages._autoUpdateInventory(data);
  }
  UI.closeModal();
  Pages.purchases(document.getElementById('content'));
};

Pages._autoUpdateInventory = function(purchase) {
  const inv = DB.get('inventory', []);
  const existing = inv.find(i => i.name === purchase.name);
  if (existing) {
    existing.quantity = (existing.quantity || 0) + (purchase.quantity || 0);
    existing.purchasePrice = purchase.unitPrice || existing.purchasePrice;
    existing.lastPurchaseDate = purchase.purchaseDate;
    DB.save('inventory', inv);
  }
};

/* ========== 库存管理 ========== */
Pages.inventory = function(container) {
  const inv = DB.get('inventory', []);
  const categories = ['肉类','米粉','调料','饮料','包装盒','餐具','耗材','其他'];

  // 统计
  const totalValue = inv.reduce((s, i) => s + (i.quantity || 0) * (i.purchasePrice || 0), 0);
  const lowStockCount = inv.filter(i => i.safeStock && i.quantity <= i.safeStock).length;

  let html = `
    <div class="stat-grid">
      <div class="stat-card info"><div class="stat-icon">🏪</div><div class="stat-label">库存种类</div><div class="stat-value">${inv.length}<small> 种</small></div></div>
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">库存总金额</div><div class="stat-value">¥${Utils.money(totalValue)}</div></div>
      <div class="stat-card danger"><div class="stat-icon">⚠️</div><div class="stat-label">库存不足</div><div class="stat-value">${lowStockCount}<small> 项</small></div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">🏪 库存管理</div>
        <div>
          <button class="btn btn-default" onclick="Pages._stockInOut()">出入库</button>
          <button class="btn btn-primary" onclick="Pages._editInventory()">+ 新增库存</button>
        </div>
      </div>
      <div class="search-bar">
        <select id="invCatFilter" onchange="Pages._filterInventory(this.value)">
          <option value="">全部分类</option>
          ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
        <input type="text" id="invSearch" placeholder="搜索库存名称..." oninput="Pages._searchInventory(this.value)">
      </div>
  `;

  const searchKey = (container.dataset.invSearch || '').toLowerCase();
  const filterCat = container.dataset.invCat || '';
  let filtered = inv;
  if (searchKey) filtered = filtered.filter(i => i.name?.toLowerCase().includes(searchKey));
  if (filterCat) filtered = filtered.filter(i => i.category === filterCat);

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无库存数据</div></div>`;
  } else {
    html += `<div class="table-wrap"><table class="data-table"><thead><tr>
      <th>名称</th><th>分类</th><th>规格</th><th>库存数量</th><th>安全库存</th><th>状态</th>
      <th>库存金额</th><th>采购价</th><th>最近采购</th><th>最近出库</th><th>操作</th>
    </tr></thead><tbody>`;
    filtered.forEach(i => {
      const isLow = i.safeStock && i.quantity <= i.safeStock;
      const stockValue = (i.quantity || 0) * (i.purchasePrice || 0);
      html += `<tr>
        <td class="font-bold">${i.name || '-'}</td>
        <td><span class="badge badge-info">${i.category || '-'}</span></td>
        <td>${i.spec || '-'}</td>
        <td class="${isLow ? 'text-danger font-bold' : ''}">${i.quantity || 0} ${i.unit || ''}</td>
        <td>${i.safeStock || 0} ${i.unit || ''}</td>
        <td>${isLow ? '<span class="badge badge-danger">库存不足</span>' : '<span class="badge badge-success">正常</span>'}</td>
        <td>¥${Utils.money(stockValue)}</td>
        <td>¥${Utils.money(i.purchasePrice || 0)}</td>
        <td>${i.lastPurchaseDate || '-'}</td>
        <td>${i.lastOutDate || '-'}</td>
        <td>
          <button class="btn btn-default btn-sm" onclick="Pages._editInventory(${i.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="Pages._deleteInventory(${i.id})">删除</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }

  html += '</div>';
  container.innerHTML = html;
};

Pages._doStockInOut = function() {
  const form = document.querySelector('.modal-body');
  const itemId = parseInt(form.querySelector('[name="itemId"]').value);
  const type = form.querySelector('[name="type"]').value;
  const amount = parseFloat(form.querySelector('[name="amount"]').value) || 0;
  const remark = form.querySelector('[name="remark"]').value;

  if (amount <= 0) { toast('请输入有效数量', 'error'); return; }

  const item = DB.findById('inventory', itemId);
  if (!item) { toast('物品不存在', 'error'); return; }

  if (type === 'in') {
    item.quantity = (item.quantity || 0) + amount;
    item.lastPurchaseDate = Utils.today();
  } else {
    if (item.quantity < amount) { toast('库存不足', 'error'); return; }
    item.quantity = (item.quantity || 0) - amount;
    item.lastOutDate = Utils.today();
  }
  DB.update('inventory', itemId, item);
  toast(`${type === 'in' ? '入库' : '出库'}成功，当前库存: ${item.quantity}${item.unit || ''}`, 'success');
  UI.closeModal();
  Pages.inventory(document.getElementById('content'));
  App.updateAlertBadge();
};

/* ========== 采购计划 ========== */
Pages.purchasePlan = function(container) {
  const inv = DB.get('inventory', []);

  // 自动生成采购清单：库存低于安全库存
  const needPurchase = inv.filter(i => i.safeStock && i.quantity <= i.safeStock).map(i => {
    const suggestQty = Math.max(i.safeStock * 2 - i.quantity, i.safeStock);
    return {
      ...i,
      suggestQty: Math.ceil(suggestQty * 10) / 10,
      suggestAmount: suggestQty * (i.purchasePrice || 0)
    };
  });

  // 即将过期的食品也需要重新采购
  const purchases = DB.get('purchases', []);
  const expiringItems = purchases.filter(p => {
    if (!p.expiryDate) return false;
    const days = Utils.daysBetween(Utils.today(), p.expiryDate);
    return days >= 0 && days <= 3;
  });

  const totalSuggestAmount = needPurchase.reduce((s, i) => s + i.suggestAmount, 0);

  let html = `
    <div class="stat-grid">
      <div class="stat-card danger"><div class="stat-icon">📦</div><div class="stat-label">需采购物品</div><div class="stat-value">${needPurchase.length}<small> 项</small></div></div>
      <div class="stat-card warning"><div class="stat-icon">⏰</div><div class="stat-label">即将过期</div><div class="stat-value">${expiringItems.length}<small> 项</small></div></div>
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">预计采购金额</div><div class="stat-value">¥${Utils.money(totalSuggestAmount)}</div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📋 采购计划（自动生成）</div>
        <button class="btn btn-success" onclick="Pages._exportPurchasePlan()">📋 导出采购清单</button>
      </div>
      <div class="text-muted text-sm mb-3">系统根据库存安全线自动生成采购建议，建议采购量 = 安全库存 × 2 - 当前库存</div>
  `;

  if (needPurchase.length === 0 && expiringItems.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">库存充足，暂无采购需求</div></div>`;
  } else {
    if (needPurchase.length > 0) {
      html += '<div class="section-title">📦 库存不足，建议采购</div>';
      html += `<div class="table-wrap"><table class="data-table"><thead><tr>
        <th>物品名称</th><th>分类</th><th>当前库存</th><th>安全库存</th><th>建议采购量</th><th>采购单价</th><th>预计金额</th><th>供应商</th>
      </tr></thead><tbody>`;
      needPurchase.forEach(i => {
        html += `<tr>
          <td class="font-bold">${i.name}</td>
          <td><span class="badge badge-info">${i.category || '-'}</span></td>
          <td class="text-danger font-bold">${i.quantity} ${i.unit || ''}</td>
          <td>${i.safeStock} ${i.unit || ''}</td>
          <td class="text-success font-bold">${i.suggestQty} ${i.unit || ''}</td>
          <td>¥${Utils.money(i.purchasePrice || 0)}</td>
          <td class="font-bold text-primary">¥${Utils.money(i.suggestAmount)}</td>
          <td>${i.supplier || '-'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }

    if (expiringItems.length > 0) {
      html += '<div class="section-title">⏰ 食品即将过期，建议补货</div>';
      html += `<div class="table-wrap"><table class="data-table"><thead><tr>
        <th>食品名称</th><th>剩余数量</th><th>到期日期</th><th>剩余天数</th><th>建议</th>
      </tr></thead><tbody>`;
      expiringItems.forEach(p => {
        const days = Utils.daysBetween(Utils.today(), p.expiryDate);
        html += `<tr>
          <td class="font-bold">${p.name}</td>
          <td>${p.quantity} ${p.unit || ''}</td>
          <td>${p.expiryDate}</td>
          <td><span class="badge ${days <= 1 ? 'badge-danger' : 'badge-warning'}">${days}天</span></td>
          <td class="text-muted">尽快使用或补充库存</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }
  }

  html += '</div>';
  container.innerHTML = html;
};

Pages._exportPurchasePlan = function() {
  const inv = DB.get('inventory', []);
  const needPurchase = inv.filter(i => i.safeStock && i.quantity <= i.safeStock).map(i => ({
    ...i,
    suggestQty: Math.max(i.safeStock * 2 - i.quantity, i.safeStock),
  }));
  const headers = ['物品名称','分类','当前库存','安全库存','建议采购量','单位','采购单价','预计金额','供应商'];
  const rows = needPurchase.map(i => [i.name, i.category, i.quantity, i.safeStock, Math.ceil(i.suggestQty*10)/10, i.unit, i.purchasePrice, (i.suggestQty * (i.purchasePrice||0)).toFixed(2), i.supplier]);
  Utils.exportCSV(`采购计划_${Utils.today()}.csv`, headers, rows);
  toast('采购清单已导出', 'success');
};

Pages.foodSafety = function(container) {
  const records = DB.get('foodSafety', []);
  records.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const types = ['晨检','冰箱温度','消毒记录','留样记录','垃圾处理','虫害检查','紫外线消毒','健康证','培训记录'];
  const today = Utils.today();
  const todayRecords = records.filter(r => r.date === today);
  const completedTypes = todayRecords.map(r => r.type);

  let html = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">🛡️ 食品安全台账 - 今日(${today})完成情况</div>
        <button class="btn btn-primary" onclick="Pages._editFoodSafety()">+ 添加记录</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px;">
        ${types.map(t => {
          const done = completedTypes.includes(t);
          return `<div style="text-align:center;padding:12px;border-radius:8px;${done ? 'background:#D4EDDA;border:2px solid #06D6A0;' : 'background:#FFF3CD;border:2px solid #FFD166;'}">
            <div style="font-size:20px;">${done ? '✅' : '⏰'}</div>
            <div style="font-size:12px;font-weight:600;margin-top:4px;">${t}</div>
            <div style="font-size:11px;color:${done ? '#155724' : '#856404'};">${done ? '已完成' : '待完成'}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">📋 历史记录</div></div>
  `;
  if (records.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无记录</div></div>`;
  } else {
    html += `<div class="table-wrap"><table class="data-table"><thead><tr>

    </tr></thead><tbody>`;
    records.forEach(r => {
      html += `<tr>
        <td>${r.date}</td>
        <td><span class="badge badge-info">${r.type || '-'}</span></td>
        <td>${Utils.esc(r.content || '-')}</td>

        <td>
          <button class="btn btn-default btn-sm" onclick="Pages._editFoodSafety(${r.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="Pages._deleteFoodSafety(${r.id})">删除</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  container.innerHTML = html;
};

/* ========== 数据统计 ========== */
Pages.stats = function(container) {
  const sales = DB.get('dailySales', []);
  const expenses = DB.get('expenses', []);
  const purchases = DB.get('purchases', []);

  // 近30天
  const days = [];
  const today = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    days.push(Utils.formatDate(d));
  }

  let html = `
    <div class="card">
      <div class="card-header"><div class="card-title">📈 营业额走势图</div></div>
      <div class="chart-container" style="height:250px;"><canvas id="statRevenueChart"></canvas></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="card">
        <div class="card-header"><div class="card-title">💰 利润走势图</div></div>
        <div class="chart-container" style="height:220px;"><canvas id="statProfitChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">📦 采购走势图</div></div>
        <div class="chart-container" style="height:220px;"><canvas id="statPurchaseChart"></canvas></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="card">
        <div class="card-header"><div class="card-title">👥 员工成本走势图</div></div>
        <div class="chart-container" style="height:220px;"><canvas id="statLaborChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">📱 平台占比</div></div>
        <div class="chart-container" style="height:220px;"><canvas id="statPlatformChart"></canvas></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="card">
        <div class="card-header"><div class="card-title">🍽️ 菜品销量排行</div></div>
        <div id="statProductRank" style="max-height:260px;overflow-y:auto;"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">📊 客单价变化</div></div>
        <div class="chart-container" style="height:220px;"><canvas id="statAvgPriceChart"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">🏪 库存走势图</div></div>
      <div class="chart-container" style="height:220px;"><canvas id="statInventoryChart"></canvas></div>
    </div>
  `;
  container.innerHTML = html;

  setTimeout(() => {
    // 营业额走势
    const revData = days.map(d => sales.filter(s => s.date === d).reduce((s, x) => s + (x.totalRevenue || 0), 0));
    App.chartInstances.statRev = new Chart(container.querySelector('#statRevenueChart').getContext('2d'), {
      type: 'line',
      data: { labels: days.map(d => d.substring(5)), datasets: [{ label: '营业额', data: revData, borderColor: '#E63946', backgroundColor: 'rgba(230,57,70,0.1)', fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } } }
    });

    // 利润走势
    const profitData = days.map((d, i) => revData[i] * 0.65 - expenses.filter(e => e.date === d).reduce((s, e) => s + (e.amount || 0), 0));
    App.chartInstances.statProfit = new Chart(container.querySelector('#statProfitChart').getContext('2d'), {
      type: 'line',
      data: { labels: days.map(d => d.substring(5)), datasets: [{ label: '净利润', data: profitData, borderColor: '#06D6A0', backgroundColor: 'rgba(6,214,160,0.1)', fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { callback: v => '¥' + v } } } }
    });

    // 采购走势
    const purchaseData = days.map(d => purchases.filter(p => p.purchaseDate === d).reduce((s, p) => s + (p.totalAmount || 0), 0));
    App.chartInstances.statPur = new Chart(container.querySelector('#statPurchaseChart').getContext('2d'), {
      type: 'bar',
      data: { labels: days.map(d => d.substring(5)), datasets: [{ label: '采购金额', data: purchaseData, backgroundColor: 'rgba(247,127,0,0.7)' }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } } }
    });

    // 员工成本走势
    const laborData = days.map(d => expenses.filter(e => e.date === d && e.category === '工资').reduce((s, e) => s + (e.amount || 0), 0));
    App.chartInstances.statLabor = new Chart(container.querySelector('#statLaborChart').getContext('2d'), {
      type: 'bar',
      data: { labels: days.map(d => d.substring(5)), datasets: [{ label: '人工成本', data: laborData, backgroundColor: 'rgba(131,56,236,0.7)' }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } } }
    });

    // 平台占比
    const platformData = {};
    sales.forEach(s => {
      platformData['美团'] = (platformData['美团'] || 0) + (s.meituan || 0);
      platformData['淘宝'] = (platformData['淘宝'] || 0) + (s.taobao || 0);
      platformData['京东'] = (platformData['京东'] || 0) + (s.jd || 0);
      platformData['堂食'] = (platformData['堂食'] || 0) + (s.dineIn || 0);
    });
    const platformEntries = Object.entries(platformData).filter(([k,v]) => v > 0);
    if (platformEntries.length > 0) {
      App.chartInstances.statPlatform = new Chart(container.querySelector('#statPlatformChart').getContext('2d'), {
        type: 'pie',
        data: { labels: platformEntries.map(e => e[0]), datasets: [{ data: platformEntries.map(e => e[1]), backgroundColor: ['#FFD166','#FF6B6B','#06D6A0','#118AB2'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
      });
    }

    // 菜品排行
    const productSales = {};
    sales.forEach(s => { if (s.products) s.products.forEach(p => { productSales[p.name] = (productSales[p.name] || 0) + (p.quantity || 0); }); });
    const topProducts = Object.entries(productSales).sort((a,b) => b[1]-a[1]).slice(0, 15);
    const rankEl = container.querySelector('#statProductRank');
    if (topProducts.length === 0) {
      rankEl.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-text">暂无菜品销量数据</div></div>';
    } else {
      rankEl.innerHTML = '<ul class="rank-list">' + topProducts.map((p, i) => {
        const rc = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
        return `<li class="rank-item"><span class="rank-num ${rc}">${i+1}</span><span class="flex-1 font-bold">${p[0]}</span><span class="text-primary font-bold">${p[1]} 份</span></li>`;
      }).join('') + '</ul>';
    }

    // 客单价变化
    const avgPriceData = days.map(d => {
      const s = sales.filter(x => x.date === d);
      const rev = s.reduce((sum, x) => sum + (x.totalRevenue || 0), 0);
      const orders = s.reduce((sum, x) => sum + (x.orderCount || 0), 0);
      return orders > 0 ? rev / orders : 0;
    });
    App.chartInstances.statAvgPrice = new Chart(container.querySelector('#statAvgPriceChart').getContext('2d'), {
      type: 'line',
      data: { labels: days.map(d => d.substring(5)), datasets: [{ label: '客单价', data: avgPriceData, borderColor: '#F77F00', backgroundColor: 'rgba(247,127,0,0.1)', fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } } }
    });

    // 库存走势（当前库存量）
    const inv = DB.get('inventory', []);
    if (inv.length > 0) {
      App.chartInstances.statInv = new Chart(container.querySelector('#statInventoryChart').getContext('2d'), {
        type: 'bar',
        data: { labels: inv.map(i => i.name), datasets: [{ label: '当前库存', data: inv.map(i => i.quantity || 0), backgroundColor: 'rgba(42,157,143,0.7)' }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true },
            x: { ticks: { autoSkip: false, maxRotation: 45, minRotation: 30, font: { size: 10 } } }
          }
        }
      });
    }
  }, 50);
};

    ]},
    { group: '智能助手', items: [
      { id: 'ai', icon: '🤖', label: 'AI 助手' },
    ]},
  ],

  init() {
    this.buildNav();
    this.bindEvents();
    this.navigate('dashboard');
    this.updateAlertBadge();
    // 每分钟更新提醒角标
    setInterval(() => this.updateAlertBadge(), 60000);
  },

  buildNav() {
    const menuEl = document.getElementById('navMenu');
    let html = '';
    this.menu.forEach(group => {
      html += `<div class="nav-group-title">${group.group}</div>`;
      group.items.forEach(item => {
        html += `<div class="nav-item" data-page="${item.id}" onclick="App.navigate('${item.id}')">
          <span class="nav-icon">${item.icon}</span>
          <span>${item.label}</span>
        </div>`;
      });
    });
    menuEl.innerHTML = html;
  },

  bindEvents() {
    // 移动端菜单
    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('show');
      document.getElementById('mobileOverlay').classList.add('show');
    });
    document.getElementById('mobileOverlay')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('mobileOverlay').classList.remove('show');
    });

    // 提醒角标点击
    document.getElementById('alertBadge')?.addEventListener('click', () => {
      this.navigate('alerts');
    });
  },

  navigate(pageId) {
    this.currentPage = pageId;
    // 更新导航高亮
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.page === pageId);
    });

    // 关闭移动端菜单
    document.getElementById('sidebar')?.classList.remove('show');
    document.getElementById('mobileOverlay')?.classList.remove('show');

    // 更新标题
    const label = this.findLabel(pageId);
    document.getElementById('pageTitle').textContent = label;

    // 销毁旧图表
    Object.values(this.chartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });
    this.chartInstances = {};

    // 渲染页面
    const content = document.getElementById('content');
    content.innerHTML = '';

    try {
      const renderer = Pages[pageId];
      if (renderer) {
        renderer(content);
      } else {
        content.innerHTML = '<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-text">模块开发中...</div></div>';
      }
    } catch(e) {
      console.error('页面渲染错误:', e);
      content.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">页面加载失败: ${e.message}</div></div>`;
    }

    // 滚动到顶部
    content.scrollTop = 0;
    window.scrollTo(0, 0);
  },

  findLabel(pageId) {
    for (const group of this.menu) {
      const item = group.items.find(i => i.id === pageId);
      if (item) return item.label;
    }
    return '';
  },

  updateAlertBadge() {
    const alerts = AlertCenter.getAllAlerts();
    const badge = document.getElementById('alertCount');
    if (badge) {
      badge.textContent = alerts.length;
      badge.style.display = alerts.length > 0 ? 'flex' : 'none';
    }
  }
};

/* ===== 通用 UI 组件 ===== */
const UI = {
  // 通用列表页面
  renderListPage(container, config) {
    const { title, columns, data, onAdd, onEdit, onDelete, onSearch, addLabel = '新增' } = config;

    let html = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${title}</div>
          <button class="btn btn-primary" onclick="${onAdd}">+ ${addLabel}</button>
        </div>
    `;

    if (onSearch) {
      html += `<div class="search-bar" id="searchBar"></div>`;
    }

    if (!data || data.length === 0) {
      html += `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无数据，点击"${addLabel}"开始记录</div></div>`;
    } else {
      html += `<div class="table-wrap"><table class="data-table"><thead><tr>`;
      columns.forEach(col => {
        html += `<th${col.width ? ` style="width:${col.width}"` : ''}>${col.label}</th>`;
      });
      if (onEdit || onDelete) html += '<th>操作</th>';
      html += '</tr></thead><tbody>';
      data.forEach((row, idx) => {
        html += '<tr>';
        columns.forEach(col => {
          let val = col.render ? col.render(row, idx) : (row[col.key] ?? '');
          html += `<td>${val}</td>`;
        });
        if (onEdit || onDelete) {
          html += '<td class="text-center">';
          if (onEdit) html += `<button class="btn btn-default btn-sm" onclick="${onEdit}(${row.id})">编辑</button> `;
          if (onDelete) html += `<button class="btn btn-danger btn-sm" onclick="${onDelete}(${row.id})">删除</button>`;
          html += '</td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '</div>';
    container.innerHTML = html;

    // 渲染搜索栏
    if (onSearch) {
      const searchBar = document.getElementById('searchBar');
      searchBar.innerHTML = onSearch();
    }
  },

  // 渲染模态框
  modal(title, bodyHtml, footerHtml, size = '') {
    const overlay = document.getElementById('modalOverlay');
    const modal = document.getElementById('modal');
    if (size) modal.className = 'modal modal-' + size;
    else modal.className = 'modal';

    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml || `<button class="btn btn-default" onclick="UI.closeModal()">关闭</button>`;
    overlay.classList.add('show');
  },

  closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  },

  // 确认对话框
  confirm(msg, onConfirm) {
    this.modal('确认操作', `<p style="font-size:14px;padding:10px 0;">${msg}</p>`,
      `<button class="btn btn-default" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-danger" id="confirmYesBtn">确认</button>`);
    document.getElementById('confirmYesBtn').onclick = () => {
      this.closeModal();
      onConfirm();
    };
  },

  // 表单字段生成
  field(label, name, type = 'text', value = '', extra = '') {
    if (type === 'textarea') {
      return `<div class="form-group"><label>${label}</label><textarea class="form-control" name="${name}" ${extra}>${Utils.esc(value)}</textarea></div>`;
    }
    if (type === 'select') {
      return `<div class="form-group"><label>${label}</label><select class="form-control" name="${name}" ${extra}>${value}</select></div>`;
    }
    return `<div class="form-group"><label>${label}</label><input type="${type}" class="form-control" name="${name}" value="${Utils.esc(value)}" ${extra}></div>`;
  },

  // 上传字段
  uploadField(label, name) {
    return `<div class="form-group">
      <label>${label}</label>
      <div class="upload-area" onclick="UI.handleUpload('${name}')">
        📷 点击上传 / 拍照
      </div>
      <div id="upload_${name}_preview" style="margin-top:6px;"></div>
    </div>`;
  },

  uploadedFiles: {},
  handleUpload(name) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          if (!this.uploadedFiles[name]) this.uploadedFiles[name] = [];
          this.uploadedFiles[name].push(ev.target.result);
          this.renderUploadPreview(name);
        };
        reader.readAsDataURL(file);
      }
    };
    input.click();
  },

  renderUploadPreview(name) {
    const el = document.getElementById(`upload_${name}_preview`);
    if (!el) return;
    const files = this.uploadedFiles[name] || [];
    el.innerHTML = files.map((src, i) =>
      `<div style="display:inline-block;margin:4px;position:relative;">
        <img src="${src}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #ddd;">
        <span onclick="UI.removeUpload('${name}',${i})" style="position:absolute;top:-4px;right:-4px;background:#ef476f;color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;">×</span>
      </div>`
    ).join('');
  },

  removeUpload(name, idx) {
    if (this.uploadedFiles[name]) {
      this.uploadedFiles[name].splice(idx, 1);
      this.renderUploadPreview(name);
    }
  },

  resetUploads() {
    this.uploadedFiles = {};
  }
};

/* ===== 智能提醒中心 v2 ===== */
const AlertCenter = {
  getAllAlerts() {
    const all = [
      ...this.foodExpiryAlerts(),
      ...this.inventoryAlerts(),
      ...this.licenseAlerts(),
      ...this.paymentAlerts(),
      ...this.employeeAlerts(),
      ...this.equipmentAlerts(),
      ...this.foodSafetyAlerts(),
    ];
    // 去重，限制最多50条
    const seen = new Set();
    return all.filter(a => {
      const key = a.title + a.desc;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0, 50);
  },

  foodExpiryAlerts() {
    const purchases = DB.get('purchases', []);
    const alerts = [];
    purchases.forEach(p => {
      if (!p.expiryDate) return;
      const days = Utils.daysBetween(Utils.today(), p.expiryDate);
      if (days <= 7 && days >= -30) {
        const level = days < 0 ? 'red' : days <= 1 ? 'red' : days <= 3 ? 'orange' : 'blue';
        alerts.push({
          type: 'food', level,
          icon: days < 0 ? '⚠️' : '🥩',
          title: days < 0 ? `${p.name} 已过期 ${Math.abs(days)} 天，请立即处理` : `${p.name} 还有 ${days} 天过期`,
          desc: `批次 ${p.batchNo || '-'} · ${p.quantity}${p.unit || ''} · ${p.supplier || ''}`,
          date: p.expiryDate, link: 'purchases'
        });
      }
    });
    return alerts;
  },

  inventoryAlerts() {
    const inv = DB.get('inventory', []);
    const alerts = [];
    inv.forEach(item => {
      if (item.safeStock && item.quantity <= item.safeStock) {
        const suggest = Math.ceil(Math.max(item.safeStock * 2 - item.quantity, item.safeStock) * 10) / 10;
        alerts.push({
          type: 'inventory', level: 'red',
          icon: '🔴',
          title: `${item.name} 库存不足，只剩 ${item.quantity}${item.unit || ''}`,
          desc: `安全库存 ${item.safeStock}${item.unit || ''} · 建议采购 ${suggest}${item.unit || ''}`,
          date: Utils.today(), link: 'purchasePlan'
        });
      }
    });
    return alerts;
  },

  licenseAlerts() {
    const licenses = DB.get('licenses', []);
    const alerts = [];
    licenses.forEach(l => {
      if (!l.expiryDate) return;
      const days = Utils.daysBetween(Utils.today(), l.expiryDate);
      if (days <= 30 && days >= -90) {
        const level = days < 0 ? 'red' : days <= 7 ? 'red' : days <= 15 ? 'orange' : 'blue';
        alerts.push({
          type: 'license', level,
          icon: days < 0 ? '🔴' : '📋',
          title: days < 0 ? `${l.name} 已过期 ${Math.abs(days)} 天` : `${l.name} 还有 ${days} 天到期`,
          desc: `到期日 ${l.expiryDate}${days <= 7 ? ' · 请尽快办理续期' : ''}`,
          date: l.expiryDate, link: 'licenses'
        });
      }
    });
    return alerts;
  },

  paymentAlerts() {
    const alerts = [];
    const today = new Date();
    const day = today.getDate();
    const monthDays = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();

    // 房租提醒
    const settings = DB.get('settings', {});
    const rentDay = parseInt(settings.rentDay) || 1;
    const rentAmount = settings.rent || 0;
    const daysToRent = rentDay >= day ? rentDay - day : (monthDays - day + rentDay);
    if (daysToRent <= 7) {
      alerts.push({
        type: 'payment', level: daysToRent <= 3 ? 'orange' : 'blue',
        icon: '🏠',
        title: `房租还有 ${daysToRent} 天到期`,
        desc: `每月${rentDay}号 · ¥${Utils.money(rentAmount)}${daysToRent <= 1 ? ' · 请提前准备' : ''}`,
        date: Utils.formatDate(Utils.addDays(Utils.today(), daysToRent)), link: 'expenses'
      });
    }

    // 工资提醒
    const employees = DB.get('employees', []);
    const activeEmps = employees.filter(e => e.status !== '离职');
    const totalSalary = activeEmps.reduce((s, e) => s + (e.salary || 0), 0);
    const salaryDay = 15;
    const daysToSalary = salaryDay >= day ? salaryDay - day : (monthDays - day + salaryDay);
    if (daysToSalary <= 7 && totalSalary > 0) {
      alerts.push({
        type: 'payment', level: daysToSalary <= 3 ? 'orange' : 'blue',
        icon: '💵',
        title: `${activeEmps.length} 名员工工资 ${daysToSalary} 天后发放`,
        desc: `合计约 ¥${Utils.money(totalSalary)} · 每月${salaryDay}号`,
        date: Utils.formatDate(Utils.addDays(Utils.today(), daysToSalary)), link: 'employees'
      });
    }

    return alerts;
  },

  employeeAlerts() {
    const employees = DB.get('employees', []);
    const alerts = [];
    employees.forEach(emp => {
      // 健康证过期
      if (emp.healthCertExpiry) {
        const days = Utils.daysBetween(Utils.today(), emp.healthCertExpiry);
        if (days <= 30 && days >= -30) {
          alerts.push({
            type: 'employee', level: days < 0 ? 'red' : days <= 7 ? 'red' : days <= 15 ? 'orange' : 'blue',
            icon: '🩺',
            title: days < 0 ? `${emp.name} 健康证已过期 ${Math.abs(days)} 天` : `${emp.name} 健康证还有 ${days} 天到期`,
            desc: `岗位: ${emp.position || ''} · 到期日: ${emp.healthCertExpiry}`,
            date: emp.healthCertExpiry, link: 'employees'
          });
        }
      }
      // 今天生日（用身份证推算）
      if (emp.idCard && emp.idCard.length >= 14) {
        const birthMonth = parseInt(emp.idCard.substring(10, 12));
        const birthDay = parseInt(emp.idCard.substring(12, 14));
        const now = new Date();
        if (birthMonth === now.getMonth() + 1 && birthDay === now.getDate()) {
          alerts.push({
            type: 'employee', level: 'purple',
            icon: '🎂',
            title: `今天是 ${emp.name} 的生日`,
            desc: `岗位: ${emp.position || ''} · 祝生日快乐！`,
            date: Utils.today(), link: 'employees'
          });
        }
      }
    });
    return alerts;
  },

  equipmentAlerts() {
    const equipment = DB.get('equipment', []);
    const alerts = [];
    equipment.forEach(eq => {
      if (!eq.nextMaintenance) return;
      const days = Utils.daysBetween(Utils.today(), eq.nextMaintenance);
      if (days <= 7 && days >= -30) {
        alerts.push({
          type: 'equipment', level: days < 0 ? 'red' : 'orange',
          icon: '🔧',
          title: days < 0 ? `${eq.name} 保养已逾期 ${Math.abs(days)} 天` : `${eq.name} 还有 ${days} 天需要保养`,
          desc: `负责人: ${eq.manager || '-'} · ${eq.nextMaintenance}`,
          date: eq.nextMaintenance, link: 'equipment'
        });
      }
    });
    return alerts;
  },

  foodSafetyAlerts() {
    const records = DB.get('foodSafety', []);
    const today = Utils.today();
    const todayRecords = records.filter(r => r.date === today);
    const completedTypes = todayRecords.map(r => r.type);
    const requiredItems = ['晨检', '冰箱温度', '消毒记录', '留样记录', '垃圾处理', '虫害检查', '紫外线消毒'];
    return requiredItems
      .filter(item => !completedTypes.includes(item))
      .map(item => ({
        type: 'foodSafety', level: 'orange',
        icon: '🛡️',
        title: `今日「${item}」还没做`,
        desc: '请及时完成并记录，确保合规',
        date: today, link: 'foodSafety'
      }));
  },
};
