/* ===== 花小小新疆炒米粉 - 门店管理系统 ===== */

:root {
  --primary: #E63946;
  --primary-dark: #C1121F;
  --primary-light: #FFEDF0;
  --secondary: #F77F00;
  --accent: #2A9D8F;
  --bg: #F5F6FA;
  --card-bg: #FFFFFF;
  --text: #1D3557;
  --text-light: #6C757D;
  --text-lighter: #ADB5BD;
  --border: #E9ECEF;
  --success: #06D6A0;
  --warning: #FFD166;
  --danger: #EF476F;
  --info: #118AB2;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 230px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== Layout ===== */
.app-layout { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #1D3557 0%, #15293f 100%);
  color: #fff;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s;
  overflow-y: auto;
}

.sidebar-header {
  padding: 18px 20px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.sidebar-header .logo {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
}
.sidebar-header .logo span { color: var(--secondary); }
.sidebar-header .subtitle {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-top: 2px;
}

.nav-menu {
  flex: 1;
  padding: 8px 0;
  list-style: none;
}
.nav-group-title {
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  padding: 12px 20px 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  border-left: 3px solid transparent;
  white-space: nowrap;
}
.nav-item:hover {
  background: rgba(255,255,255,0.08);
  color: #fff;
}
.nav-item.active {
  background: rgba(230,57,70,0.2);
  color: #fff;
  border-left-color: var(--primary);
}
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

.main-area {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  background: var(--card-bg);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-left .menu-toggle {
  display: none;
  font-size: 20px;
  cursor: pointer;
  background: none;
  border: none;
  color: var(--text);
}
.topbar h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-date {
  font-size: 13px;
  color: var(--text-light);
}
.alert-badge {
  position: relative;
  cursor: pointer;
  font-size: 20px;
}
.alert-badge .badge-count {
  position: absolute;
  top: -6px; right: -8px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.content {
  padding: 20px 24px;
  flex: 1;
}

/* ===== Cards ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ===== Stat Cards ===== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-card .stat-label {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 6px;
}
.stat-card .stat-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
}
.stat-card .stat-value small { font-size: 13px; font-weight: 600; color: var(--text-light); }
.stat-card .stat-icon {
  position: absolute;
  top: 12px; right: 12px;
  font-size: 24px;
  opacity: 0.15;
}
.stat-card.primary .stat-value { color: var(--primary); }
.stat-card.success .stat-value { color: var(--success); }
.stat-card.warning .stat-value { color: var(--warning); }
.stat-card.danger .stat-value { color: var(--danger); }
.stat-card.info .stat-value { color: var(--info); }

/* ===== Section Title ===== */
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin: 20px 0 10px;
  padding-left: 10px;
  border-left: 3px solid var(--primary);
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-info { background: var(--info); color: #fff; }
.btn-default { background: var(--border); color: var(--text); }
.btn-default:hover { background: #dee2e6; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-lg { padding: 10px 20px; font-size: 14px; }
.btn-block { width: 100%; justify-content: center; }

/* ===== Tables ===== */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-sm);
}
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th {
  background: #F8F9FA;
  padding: 10px 12px;
  text-align: left;
  font-weight: 700;
  color: var(--text);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table tbody tr:hover { background: #F8F9FA; }
.data-table .text-right { text-align: right; }
.data-table .text-center { text-align: center; }

/* ===== Badges ===== */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
}
.badge-success { background: #D4EDDA; color: #155724; }
.badge-warning { background: #FFF3CD; color: #856404; }
.badge-danger { background: #F8D7DA; color: #721C24; }
.badge-info { background: #D1ECF1; color: #0C5460; }
.badge-default { background: #E9ECEF; color: var(--text-light); }

/* ===== Forms ===== */
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.form-control {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  outline: none;
  transition: border 0.2s;
}
.form-control:focus { border-color: var(--primary); }
textarea.form-control { resize: vertical; min-height: 60px; }
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: var(--radius);
  width: 100%;
  max-width: 640px;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.3s;
}
.modal.modal-lg { max-width: 900px; }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close {
  background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-light);
  line-height: 1;
}
.modal-body { padding: 20px; max-height: 60vh; overflow-y: auto; }
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* ===== Charts ===== */
.chart-container { position: relative; width: 100%; }
.chart-container canvas { max-width: 100%; }

/* ===== Alert Items ===== */
.alert-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  border-left: 4px solid;
}
.alert-item.danger { background: #FEF0F0; border-color: var(--danger); }
.alert-item.warning { background: #FFF8E6; border-color: var(--warning); }
.alert-item.info { background: #E8F4FD; border-color: var(--info); }
.alert-item.success { background: #E8F8F0; border-color: var(--success); }
.alert-item .alert-icon { font-size: 20px; flex-shrink: 0; }
.alert-item .alert-content { flex: 1; }
.alert-item .alert-title { font-weight: 700; font-size: 13px; }
.alert-item .alert-desc { font-size: 12px; color: var(--text-light); }

/* ===== Tabs ===== */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 16px;
  overflow-x: auto;
}
.tab {
  padding: 8px 16px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ===== Search Bar ===== */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.search-bar input, .search-bar select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  outline: none;
}

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-lighter);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 14px; }

/* ===== Progress Bar ===== */
.progress {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s;
}

/* ===== AI Chat ===== */
.chat-container {
  max-height: 500px;
  display: flex;
  flex-direction: column;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  max-height: 400px;
}
.chat-msg {
  margin-bottom: 12px;
  max-width: 85%;
}
.chat-msg.user { margin-left: auto; }
.chat-msg .chat-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
}
.chat-msg.ai .chat-bubble {
  background: var(--primary-light);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.chat-msg.user .chat-bubble {
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-input-area {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.chat-suggestions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.chat-suggestion {
  padding: 4px 10px;
  background: var(--border);
  border-radius: 12px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.chat-suggestion:hover { background: var(--primary-light); color: var(--primary); }

/* ===== Mobile ===== */
.mobile-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99;
}

@media (max-width: 768px) {
  :root { --sidebar-w: 230px; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.show { transform: translateX(0); }
  .main-area { margin-left: 0; }
  .topbar-left .menu-toggle { display: block; }
  .mobile-overlay.show { display: block; }
  .content { padding: 12px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-card .stat-value { font-size: 18px; }
  .form-row { grid-template-columns: 1fr; }
  .card { padding: 14px; }
  .modal { max-width: 100%; }
}

@media (max-width: 480px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .topbar h1 { font-size: 15px; }
  .topbar-date { display: none; }
}

/* ===== Utility ===== */
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warning { color: var(--warning); }
.text-primary { color: var(--primary); }
.text-muted { color: var(--text-light); }
.text-center { text-align: center; }
.text-right { text-align: right; }
.font-bold { font-weight: 700; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.flex-wrap { flex-wrap: wrap; }
.hidden { display: none !important; }
.cursor-pointer { cursor: pointer; }
.text-sm { font-size: 12px; }
.text-lg { font-size: 16px; }
.text-xl { font-size: 18px; }
.text-2xl { font-size: 22px; }

/* Quick action grid */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.quick-action {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.quick-action:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.quick-action .qa-icon { font-size: 26px; margin-bottom: 6px; }
.quick-action .qa-label { font-size: 12px; color: var(--text); font-weight: 600; }

/* Trend indicator */
.trend-up { color: var(--success); }
.trend-down { color: var(--danger); }
.trend-flat { color: var(--text-light); }

/* Upload area */
.upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  color: var(--text-light);
  font-size: 13px;
  transition: border 0.2s;
}
.upload-area:hover { border-color: var(--primary); color: var(--primary); }
.upload-preview {
  display: inline-block;
  margin: 4px;
  width: 60px; height: 60px;
  border-radius: 6px;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  color: var(--text-light);
}

/* Rank list */
.rank-list { list-style: none; }
.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.rank-item:last-child { border-bottom: none; }
.rank-num {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
  background: var(--border);
  color: var(--text-light);
}

/* ===== db.js ===== */
/* ===== 数据层 - 基于 localStorage 的持久化存储 ===== */

const DB = {
  _prefix: 'hxx_mis_',

  get(key, defaultValue) {
    try {
      const raw = localStorage.getItem(this._prefix + key);
      return raw ? JSON.parse(raw) : (defaultValue !== undefined ? defaultValue : []);
    } catch(e) { return defaultValue !== undefined ? defaultValue : []; }
  },

  set(key, value) {
    localStorage.setItem(this._prefix + key, JSON.stringify(value));
  },

  // 各数据表
  tables: {
    purchases: 'purchases',          // 进货台账
    suppliers: 'suppliers',          // 供应商
    inventory: 'inventory',          // 库存
    dailySales: 'dailySales',        // 每日营业记录
    expenses: 'expenses',            // 每日支出
    incomes: 'incomes',              // 每日收入
    employees: 'employees',          // 员工
    foodSafety: 'foodSafety',        // 食品安全
    equipment: 'equipment',          // 设备
    contracts: 'contracts',          // 合同
    licenses: 'licenses',            // 证照
    complaints: 'complaints',        // 客户投诉
    badReviews: 'badReviews',        // 差评
    cashflow: 'cashflow',            // 现金流账户
    products: 'products',            // 菜品
    settings: 'settings'             // 系统设置
  },

  getAll(tableName) {
    return this.get(this.tables[table_enum(tableName)] || tableName, []);
  },

  save(tableName, data) {
    this.set(tableName, data);
  },

  add(tableName, item) {
    const data = this.get(tableName, []);
    item.id = item.id || Date.now() + Math.floor(Math.random() * 1000);
    item.createdAt = item.createdAt || new Date().toISOString();
    data.push(item);
    this.set(tableName, data);
    return item;
  },

  update(tableName, id, updates) {
    const data = this.get(tableName, []);
    const idx = data.findIndex(d => d.id === id);
    if (idx >= 0) {
      data[idx] = { ...data[idx], ...updates, updatedAt: new Date().toISOString() };
      this.set(tableName, data);
      return data[idx];
    }
    return null;
  },

  remove(tableName, id) {
    const data = this.get(tableName, []);
    const filtered = data.filter(d => d.id !== id);
    this.set(tableName, filtered);
    return data.length !== filtered.length;
  },

  findById(tableName, id) {
    const data = this.get(tableName, []);
    return data.find(d => d.id === id);
  }
};

// 简单表名映射
function table_enum(name) { return name; }

/* ===== 工具函数 ===== */
const Utils = {
  formatDate(date) {
    if (!date) return '';
    const d = typeof date === 'string' ? new Date(date) : date;
    if (isNaN(d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },

  formatDateTime(date) {
    if (!date) return '';
    const d = typeof date === 'string' ? new Date(date) : date;
    if (isNaN(d)) return '';
    return this.formatDate(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  },

  today() { return this.formatDate(new Date()); },

  money(num) {
    if (num === null || num === undefined || isNaN(num)) return '0.00';
    return Number(num).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },

  moneyYuan(num) {
    return '¥' + this.money(num);
  },

  daysBetween(date1, date2) {
    const d1 = new Date(date1);
    const d2 = new Date(date2);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  },

  addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  },

  // 计算到期日期
  calcExpiry(productionDate, shelfLifeDays) {
    if (!productionDate || !shelfLifeDays) return '';
    return this.formatDate(this.addDays(productionDate, parseInt(shelfLifeDays)));
  },

  // 获取本月范围
  monthRange() {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
    return { start, end };
  },

  // 判断日期是否在范围内
  inRange(dateStr, start, end) {
    const d = new Date(dateStr);
    return d >= start && d <= end;
  },

  // 判断是否今天
  isToday(dateStr) {
    return this.formatDate(dateStr) === this.today();
  },

  // 判断是否本月
  isThisMonth(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  },

  // 导出 CSV
  exportCSV(filename, headers, rows) {
    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
      csv += row.map(cell => {
        cell = String(cell || '').replace(/"/g, '""');
        return `"${cell}"`;
      }).join(',') + '\n';
    });
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    this.download(filename, blob);
  },

  download(filename, blob) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
  },

  // 打印
  print(content) {
    const w = window.open('', '_blank');
    w.document.write(`
      <html><head><title>打印</title>
      <style>
        body{font-family:sans-serif;padding:20px;}
        table{width:100%;border-collapse:collapse;margin:10px 0;}
        th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:12px;}
        th{background:#f5f5f5;}
        h1,h2,h3{color:#333;}
      </style>
      </head><body>${content}</body></html>
    `);
    w.document.close();
    w.print();
  },

  uid() {
    return Date.now() + Math.floor(Math.random() * 10000);
  },

  // 转义HTML
  esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
};

/* ===== 确认对话框 ===== */
function confirmDialog(msg, callback) {
  if (confirm(msg)) callback();
}

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  const colors = { info: '#118AB2', success: '#06D6A0', error: '#EF476F', warning: '#FFD166' };
  t.style.cssText = `position:fixed;top:80px;right:24px;background:${colors[type]||colors.info};color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideUp .3s;`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

/* ===== 通用 UI 组件 ===== */
const UI = {
  // 通用列表页面
  renderListPage(container, config) {
    const { title, columns, data, onAdd, onEdit, onDelete, onSearch, addLabel = '新增' } = config;

    let html = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${title}</div>
          <button class="btn btn-primary" onclick="${onAdd}">+ ${addLabel}</button>
        </div>
    `;

    if (onSearch) {
      html += `<div class="search-bar" id="searchBar"></div>`;
    }

    if (!data || data.length === 0) {
      html += `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无数据，点击"${addLabel}"开始记录</div></div>`;
    } else {
      html += `<div class="table-wrap"><table class="data-table"><thead><tr>`;
      columns.forEach(col => {
        html += `<th${col.width ? ` style="width:${col.width}"` : ''}>${col.label}</th>`;
      });
      if (onEdit || onDelete) html += '<th>操作</th>';
      html += '</tr></thead><tbody>';
      data.forEach((row, idx) => {
        html += '<tr>';
        columns.forEach(col => {
          let val = col.render ? col.render(row, idx) : (row[col.key] ?? '');
          html += `<td>${val}</td>`;
        });
        if (onEdit || onDelete) {
          html += '<td class="text-center">';
          if (onEdit) html += `<button class="btn btn-default btn-sm" onclick="${onEdit}(${row.id})">编辑</button> `;
          if (onDelete) html += `<button class="btn btn-danger btn-sm" onclick="${onDelete}(${row.id})">删除</button>`;
          html += '</td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '</div>';
    container.innerHTML = html;

    // 渲染搜索栏
    if (onSearch) {
      const searchBar = document.getElementById('searchBar');
      searchBar.innerHTML = onSearch();
    }
  },

  // 渲染模态框
  modal(title, bodyHtml, footerHtml, size = '') {
    const overlay = document.getElementById('modalOverlay');
    const modal = document.getElementById('modal');
    if (size) modal.className = 'modal modal-' + size;
    else modal.className = 'modal';

    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml || `<button class="btn btn-default" onclick="UI.closeModal()">关闭</button>`;
    overlay.classList.add('show');
  },

  closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  },

  // 确认对话框
  confirm(msg, onConfirm) {
    this.modal('确认操作', `<p style="font-size:14px;padding:10px 0;">${msg}</p>`,
      `<button class="btn btn-default" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-danger" id="confirmYesBtn">确认</button>`);
    document.getElementById('confirmYesBtn').onclick = () => {
      this.closeModal();
      onConfirm();
    };
  },

  // 表单字段生成
  field(label, name, type = 'text', value = '', extra = '') {
    if (type === 'textarea') {
      return `<div class="form-group"><label>${label}</label><textarea class="form-control" name="${name}" ${extra}>${Utils.esc(value)}</textarea></div>`;
    }
    if (type === 'select') {
      return `<div class="form-group"><label>${label}</label><select class="form-control" name="${name}" ${extra}>${value}</select></div>`;
    }
    return `<div class="form-group"><label>${label}</label><input type="${type}" class="form-control" name="${name}" value="${Utils.esc(value)}" ${extra}></div>`;
  },

  // 上传字段
  uploadField(label, name) {
    return `<div class="form-group">
      <label>${label}</label>
      <div class="upload-area" onclick="UI.handleUpload('${name}')">
        📷 点击上传 / 拍照
      </div>
      <div id="upload_${name}_preview" style="margin-top:6px;"></div>
    </div>`;
  },

  uploadedFiles: {},
  handleUpload(name) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          if (!this.uploadedFiles[name]) this.uploadedFiles[name] = [];
          this.uploadedFiles[name].push(ev.target.result);
          this.renderUploadPreview(name);
        };
        reader.readAsDataURL(file);
      }
    };
    input.click();
  },

  renderUploadPreview(name) {
    const el = document.getElementById(`upload_${name}_preview`);
    if (!el) return;
    const files = this.uploadedFiles[name] || [];
    el.innerHTML = files.map((src, i) =>
      `<div style="display:inline-block;margin:4px;position:relative;">
        <img src="${src}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #ddd;">
        <span onclick="UI.removeUpload('${name}',${i})" style="position:absolute;top:-4px;right:-4px;background:#ef476f;color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;">×</span>
      </div>`
    ).join('');
  },

  removeUpload(name, idx) {
    if (this.uploadedFiles[name]) {
      this.uploadedFiles[name].splice(idx, 1);
      this.renderUploadPreview(name);
    }
  },

  resetUploads() {
    this.uploadedFiles = {};
  }
};

/* ===== 提醒中心 ===== */
const AlertCenter = {
  getAllAlerts() {
    return [
      ...this.foodExpiryAlerts(),
      ...this.inventoryAlerts(),
      ...this.licenseAlerts(),
      ...this.paymentAlerts(),
      ...this.equipmentAlerts(),
      ...this.foodSafetyAlerts(),
    ];
  },

  // 食品过期提醒
  foodExpiryAlerts() {
    const purchases = DB.get('purchases', []);
    const alerts = [];
    purchases.forEach(p => {
      if (!p.expiryDate) return;
      const days = Utils.daysBetween(Utils.today(), p.expiryDate);
      if (days <= 7 && days >= -30) {
        let level = 'danger', icon = '🔴';
        if (days < 0) { level = 'danger'; icon = '⚫'; }
        else if (days <= 1) { level = 'danger'; icon = '🔴'; }
        else if (days <= 3) { level = 'warning'; icon = '🟡'; }
        else { level = 'info'; icon = '🔵'; }
        alerts.push({
          type: 'food',
          level,
          icon,
          title: days < 0 ? `${p.name} 已过期${Math.abs(days)}天` : `${p.name} 将在${days}天后过期`,
          desc: `批次: ${p.batchNo || '-'} | 到期: ${p.expiryDate} | 供应商: ${p.supplier || '-'}`,
          date: p.expiryDate
        });
      }
    });
    return alerts;
  },

  // 库存不足提醒
  inventoryAlerts() {
    const inv = DB.get('inventory', []);
    const alerts = [];
    inv.forEach(item => {
      if (item.safeStock && item.quantity !== undefined && item.quantity <= item.safeStock) {
        alerts.push({
          type: 'inventory',
          level: 'danger',
          icon: '📦',
          title: `${item.name} 库存不足`,
          desc: `当前库存: ${item.quantity}${item.unit || ''} | 安全库存: ${item.safeStock}${item.unit || ''}`,
          date: Utils.today()
        });
      }
    });
    return alerts;
  },

  // 证照到期提醒
  licenseAlerts() {
    const licenses = DB.get('licenses', []);
    const alerts = [];
    licenses.forEach(l => {
      if (!l.expiryDate) return;
      const days = Utils.daysBetween(Utils.today(), l.expiryDate);
      if (days <= 30 && days >= -90) {
        let level = days < 0 ? 'danger' : days <= 7 ? 'danger' : days <= 15 ? 'warning' : 'info';
        alerts.push({
          type: 'license',
          level,
          icon: '📋',
          title: days < 0 ? `${l.name} 已过期${Math.abs(days)}天` : `${l.name} 将在${days}天后到期`,
          desc: `到期日期: ${l.expiryDate}`,
          date: l.expiryDate
        });
      }
    });
    return alerts;
  },

  // 付款提醒（工资、房租等定期支出）
  paymentAlerts() {
    const alerts = [];
    const today = new Date();
    const day = today.getDate();

    // 员工工资提醒（每月15号）
    if (day >= 10 && day <= 15) {
      const employees = DB.get('employees', []);
      if (employees.length > 0) {
        const total = employees.reduce((s, e) => s + (e.salary || 0), 0);
        alerts.push({
          type: 'payment',
          level: 'warning',
          icon: '💵',
          title: '员工工资即将发放',
          desc: `本月${employees.length}名员工，工资总额约 ¥${Utils.money(total)}（每月15日发放）`,
          date: Utils.today()
        });
      }
    }

    // 房租提醒（每月1号前5天）
    const settings = DB.get('settings', {});
    if (settings.rent && settings.rentDay) {
      const rentDay = parseInt(settings.rentDay);
      if (day >= rentDay - 5 && day < rentDay) {
        alerts.push({
          type: 'payment',
          level: 'warning',
          icon: '🏠',
          title: '房租即将到期',
          desc: `每月${rentDay}号需交房租 ¥${Utils.money(settings.rent)}`,
          date: Utils.today()
        });
      }
    }

    return alerts;
  },

  // 设备保养提醒
  equipmentAlerts() {
    const equipment = DB.get('equipment', []);
    const alerts = [];
    equipment.forEach(eq => {
      if (!eq.nextMaintenance) return;
      const days = Utils.daysBetween(Utils.today(), eq.nextMaintenance);
      if (days <= 7 && days >= -30) {
        alerts.push({
          type: 'equipment',
          level: days < 0 ? 'danger' : 'warning',
          icon: '🔧',
          title: days < 0 ? `${eq.name} 保养已逾期${Math.abs(days)}天` : `${eq.name} 即将保养`,
          desc: `负责人: ${eq.manager || '-'} | 保养日期: ${eq.nextMaintenance}`,
          date: eq.nextMaintenance
        });
      }
    });
    return alerts;
  },

  // 食品安全提醒
  foodSafetyAlerts() {
    const records = DB.get('foodSafety', []);
    const today = Utils.today();
    const todayRecords = records.filter(r => r.date === today);
    const requiredItems = ['晨检', '冰箱温度', '消毒记录', '留样记录', '垃圾处理', '虫害检查', '紫外线消毒'];
    const alerts = [];
    const completedItems = todayRecords.map(r => r.type);
    requiredItems.forEach(item => {
      if (!completedItems.includes(item)) {
        alerts.push({
          type: 'foodSafety',
          level: 'warning',
          icon: '🛡️',
          title: `今日${item}未完成`,
          desc: `请及时完成今日${item}记录`,
          date: today
        });
      }
    });
    return alerts;
  },
};

Pages._renderRevenueChart = function(container) {
  const canvas = container.querySelector('#revenueChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const sales = DB.get('dailySales', []);
  const expenses = DB.get('expenses', []);

  // 近30天
  const days = [];
  const today = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(Utils.formatDate(d));
  }

  const revenueData = days.map(d => {
    const s = sales.filter(s => s.date === d);
    return s.reduce((sum, x) => sum + (x.totalRevenue || 0), 0);
  });

  const profitData = days.map((d, i) => {
    const rev = revenueData[i];
    const dayExpenses = expenses.filter(e => e.date === d).reduce((s, e) => s + (e.amount || 0), 0);
    return rev * 0.65 - dayExpenses;
  });

  App.chartInstances.revenue = new Chart(ctx, {
    type: 'line',
    data: {
      labels: days.map(d => d.substring(5)),
      datasets: [
        { label: '营业额', data: revenueData, borderColor: '#E63946', backgroundColor: 'rgba(230,57,70,0.1)', fill: true, tension: 0.3 },
        { label: '净利润', data: profitData, borderColor: '#06D6A0', backgroundColor: 'rgba(6,214,160,0.1)', fill: true, tension: 0.3 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } }
    }
  });
};

Pages._renderExpensePie = function(container, expenseData) {
  const canvas = container.querySelector('#expensePieChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const entries = Object.entries(expenseData).filter(([k, v]) => v > 0);
  if (entries.length === 0) {
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#ADB5BD';
    ctx.textAlign = 'center';
    ctx.fillText('暂无支出数据', canvas.width / 2, 130);
    return;
  }

  const colors = ['#E63946','#F77F00','#FFD166','#06D6A0','#118AB2','#8338EC','#EF476F','#2A9D8F','#7209B7','#FB5607'];

  App.chartInstances.expensePie = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: entries.map(e => e[0]),
      datasets: [{ data: entries.map(e => e[1]), backgroundColor: colors.slice(0, entries.length) }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { font: { size: 11 } } } }
    }
  });
};

  html += `</div>
      <div class="card">
        <div class="card-header"><div class="card-title">⚠️ 浪费/损耗排行（哪些东西浪费最多）</div></div>
  `;

  // 从进货台账中统计
  const wasteData = {};
  purchases.forEach(p => {
    if (p.wasteAmount && p.wasteAmount > 0) {
      wasteData[p.name] = (wasteData[p.name] || 0) + p.wasteAmount;
    }
  });
  const topWaste = Object.entries(wasteData).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (topWaste.length === 0) {
    html += '<div class="empty-state"><div class="empty-text">暂无损耗数据<br><small>在进货台账中记录损耗即可统计</small></div></div>';
  } else {
    html += '<ul class="rank-list">';
    topWaste.forEach((w, i) => {
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      html += `<li class="rank-item">
        <span class="rank-num ${rankClass}">${i + 1}</span>
        <span class="flex-1 font-bold">${w[0]}</span>
        <span class="text-danger font-bold">损耗 ¥${Utils.money(w[1])}</span>
      </li>`;
    });
    html += '</ul>';
  }

  html += `</div></div>`;

  // 月度趋势
  html += `
    <div class="card">
      <div class="card-header"><div class="card-title">📈 近6个月营收利润趋势</div></div>
      <div class="chart-container" style="height:280px;"><canvas id="bossTrendChart"></canvas></div>
    </div>
  `;

  container.innerHTML = html;

  // 渲染图表
  setTimeout(() => {
    // 平台占比
    const platformCanvas = container.querySelector('#platformChart');
    if (platformCanvas) {
      const platformEntries = Object.entries(platformData).filter(([k, v]) => v > 0);
      if (platformEntries.length > 0) {
        App.chartInstances.platform = new Chart(platformCanvas.getContext('2d'), {
          type: 'doughnut',
          data: {
            labels: platformEntries.map(e => e[0]),
            datasets: [{ data: platformEntries.map(e => e[1]), backgroundColor: ['#FFD166','#FF6B6B','#06D6A0','#118AB2','#8338EC'] }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
        });
      }
    }

    // 月度趋势
    const trendCanvas = container.querySelector('#bossTrendChart');
    if (trendCanvas) {
      const months = [];
      const revData = [];
      const profitData = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const mStart = new Date(d.getFullYear(), d.getMonth(), 1);
        const mEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59);
        const mSales = sales.filter(s => { const sd = new Date(s.date); return sd >= mStart && sd <= mEnd; });
        const mExp = expenses.filter(e => { const ed = new Date(e.date); return ed >= mStart && ed <= mEnd; });
        const rev = mSales.reduce((s, x) => s + (x.totalRevenue || 0), 0);
        const exp = mExp.reduce((s, e) => s + (e.amount || 0), 0);
        months.push((d.getMonth() + 1) + '月');
        revData.push(rev);
        profitData.push(rev * 0.65 - exp);
      }
      App.chartInstances.bossTrend = new Chart(trendCanvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: months,
          datasets: [
            { label: '营业额', data: revData, backgroundColor: 'rgba(230,57,70,0.7)', borderColor: '#E63946', borderWidth: 1 },
            { label: '净利润', data: profitData, backgroundColor: 'rgba(6,214,160,0.7)', borderColor: '#06D6A0', borderWidth: 1 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } } }
      });
    }
  }, 50);
};

/* ========== 老板提醒中心 ========== */
Pages.alerts = function(container) {
  const alerts = AlertCenter.getAllAlerts().sort((a, b) => {
    const order = { danger: 0, warning: 1, info: 2, success: 3 };
    return (order[a.level] || 9) - (order[b.level] || 9);
  });

  // 按类型分组
  const groups = {};
  alerts.forEach(a => {
    if (!groups[a.type]) groups[a.type] = [];
    groups[a.type].push(a);
  });

  const typeNames = {
    food: '🍎 食品过期提醒',
    inventory: '📦 库存不足提醒',
    license: '📋 证照到期提醒',
    payment: '💵 付款提醒',
    equipment: '🔧 设备保养提醒',
    foodSafety: '🛡️ 食品安全提醒'
  };

  let html = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔔 老板提醒中心</div>
        <span class="badge badge-danger">${alerts.length} 项待处理</span>
      </div>
  `;

  if (alerts.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">太棒了！当前没有需要处理的提醒事项</div></div>`;
  } else {
    Object.entries(groups).forEach(([type, items]) => {
      html += `<div class="section-title">${typeNames[type] || type} (${items.length})</div>`;
      items.forEach(a => {
        html += `
          <div class="alert-item ${a.level}">
            <div class="alert-icon">${a.icon}</div>
            <div class="alert-content">
              <div class="alert-title">${a.title}</div>
              <div class="alert-desc">${a.desc}</div>
            </div>
          </div>
        `;
      });
    });
  }

  html += '</div>';
  container.innerHTML = html;
};

/* ========== 食品进货台账 ========== */
Pages.purchases = function(container) {
  let purchases = DB.get('purchases', []);
  const suppliers = DB.get('suppliers', []);

  // 过滤
  const searchKey = container.dataset.search || '';
  const filterCat = container.dataset.filterCat || '';
  let filtered = purchases;
  if (searchKey) filtered = filtered.filter(p => p.name?.includes(searchKey) || p.supplier?.includes(searchKey));
  if (filterCat) filtered = filtered.filter(p => p.category === filterCat);

  // 按日期倒序
  filtered.sort((a, b) => (b.purchaseDate || '').localeCompare(a.purchaseDate || ''));

  const categories = ['肉类','蔬菜','调料','饮料','米粉','包装盒','餐具','耗材','其他'];

  // 统计
  const totalAmount = filtered.reduce((s, p) => s + (p.totalAmount || 0), 0);
  const expiringCount = filtered.filter(p => {
    if (!p.expiryDate) return false;
    const days = Utils.daysBetween(Utils.today(), p.expiryDate);
    return days >= 0 && days <= 7;
  }).length;
  const expiredCount = filtered.filter(p => {
    if (!p.expiryDate) return false;
    return Utils.daysBetween(Utils.today(), p.expiryDate) < 0;
  }).length;

  let html = `
    <div class="stat-grid">
      <div class="stat-card info"><div class="stat-icon">📦</div><div class="stat-label">进货记录</div><div class="stat-value">${filtered.length}<small> 笔</small></div></div>
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">总金额</div><div class="stat-value">¥${Utils.money(totalAmount)}</div></div>
      <div class="stat-card warning"><div class="stat-icon">⏰</div><div class="stat-label">即将过期</div><div class="stat-value">${expiringCount}<small> 项</small></div></div>
      <div class="stat-card danger"><div class="stat-icon">⚫</div><div class="stat-label">已过期</div><div class="stat-value">${expiredCount}<small> 项</small></div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📦 食品进货台账</div>
        <button class="btn btn-primary" onclick="Pages._editPurchase()">+ 新增进货</button>
      </div>
      <div class="search-bar">
        <input type="text" id="purchaseSearch" placeholder="搜索食品名称/供应商..." value="${searchKey}" oninput="Pages._searchPurchase(this.value)">
        <select id="purchaseCatFilter" onchange="Pages._filterPurchaseCat(this.value)">
          <option value="">全部分类</option>
          ${categories.map(c => `<option value="${c}" ${filterCat === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <button class="btn btn-default" onclick="Pages._exportPurchases()">📋 导出CSV</button>
      </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无进货记录</div></div>`;
  } else {
    html += `<div class="table-wrap"><table class="data-table"><thead><tr>
      <th>进货日期</th><th>食品名称</th><th>分类</th><th>规格</th><th>数量</th>
      <th>单价</th><th>金额</th><th>供应商</th><th>到期日期</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>`;
    filtered.forEach(p => {
      let status = '', badge = 'badge-success';
      if (p.expiryDate) {
        const days = Utils.daysBetween(Utils.today(), p.expiryDate);
        if (days < 0) { status = `已过期${Math.abs(days)}天`; badge = 'badge-danger'; }
        else if (days <= 1) { status = `${days}天后过期`; badge = 'badge-danger'; }
        else if (days <= 3) { status = `${days}天后过期`; badge = 'badge-warning'; }
        else if (days <= 7) { status = `${days}天后过期`; badge = 'badge-info'; }
        else { status = '正常'; badge = 'badge-success'; }
      }
      html += `<tr>
        <td>${p.purchaseDate || '-'}</td>
        <td class="font-bold">${p.name || '-'}</td>
        <td><span class="badge badge-info">${p.category || '-'}</span></td>
        <td>${p.spec || '-'}</td>
        <td>${p.quantity || 0} ${p.unit || ''}</td>
        <td>¥${Utils.money(p.unitPrice || 0)}</td>
        <td class="font-bold text-primary">¥${Utils.money(p.totalAmount || 0)}</td>
        <td>${p.supplier || '-'}</td>
        <td>${p.expiryDate || '-'}</td>
        <td><span class="badge ${badge}">${status || '-'}</span></td>
        <td>
          <button class="btn btn-default btn-sm" onclick="Pages._viewPurchase(${p.id})">查看</button>
          <button class="btn btn-default btn-sm" onclick="Pages._editPurchase(${p.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="Pages._deletePurchase(${p.id})">删除</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }

  html += '</div>';
  container.innerHTML = html;
};

Pages._searchPurchase = function(val) {

};

Pages._filterPurchaseCat = function(val) {

        <select class="form-control" name="category">

      <div class="form-group">
        <label>单位</label>
        <select class="form-control" name="unit">
          ${units.map(u => `<option value="${u}" ${purchase.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
        </select>
      </div>
      ${UI.field('单价(元)', 'unitPrice', 'number', purchase.unitPrice || '', 'required step="0.01" oninput="Pages._calcPurchaseAmount()"')}
      ${UI.field('金额(元)', 'totalAmount', 'number', purchase.totalAmount || '', 'readonly')}
      <div class="form-group">
        <label>供应商</label>
        <select class="form-control" name="supplier">
          <option value="">请选择</option>
          ${suppliers.map(s => `<option value="${s.name}" ${purchase.supplier === s.name ? 'selected' : ''}>${s.name}</option>`).join('')}
        </select>
      </div>
      ${UI.field('联系电话', 'contactPhone', 'text', purchase.contactPhone || '', 'placeholder="供应商电话"')}
      ${UI.field('生产日期', 'productionDate', 'date', purchase.productionDate || '')}
      ${UI.field('保质期(天)', 'shelfLife', 'number', purchase.shelfLife || '', 'oninput="Pages._calcExpiry()"')}
      ${UI.field('到期日期', 'expiryDate', 'date', purchase.expiryDate || '', 'readonly')}
      ${UI.field('批次号', 'batchNo', 'text', purchase.batchNo || '', 'placeholder="如：PC20260730-001"')}
      ${UI.field('进货凭证编号', 'voucherNo', 'text', purchase.voucherNo || '')}
      ${UI.field('发票编号', 'invoiceNo', 'text', purchase.invoiceNo || '')}
      ${UI.field('入库人', 'receiver', 'text', purchase.receiver || '')}
      ${UI.field('备注', 'remark', 'text', purchase.remark || '')}
    </div>
    <div class="form-row">
      ${UI.uploadField('上传发票照片', 'invoicePhoto')}
      ${UI.uploadField('上传送货单照片', 'deliveryNote')}
      ${UI.uploadField('上传食品标签照片', 'foodLabel')}
      ${UI.uploadField('上传检验报告', 'inspectionReport')}
    </div>
  `;

  const footer = `
    <button class="btn btn-default" onclick="UI.closeModal()">取消</button>
    <button class="btn btn-primary" onclick="Pages._savePurchase(${id || 'null'})">保存</button>
  `;

  UI.modal(id ? '编辑进货记录' : '新增进货记录', body, footer, 'lg');
};

Pages._calcPurchaseAmount = function() {
  const qty = parseFloat(document.querySelector('[name="quantity"]').value) || 0;
  const price = parseFloat(document.querySelector('[name="unitPrice"]').value) || 0;
  document.querySelector('[name="totalAmount"]').value = (qty * price).toFixed(2);
};

Pages._calcExpiry = function() {
  const prodDate = document.querySelector('[name="productionDate"]').value;
  const shelfLife = parseInt(document.querySelector('[name="shelfLife"]').value) || 0;
  if (prodDate && shelfLife) {
    document.querySelector('[name="expiryDate"]').value = Utils.calcExpiry(prodDate, shelfLife);
  }
};

Pages._savePurchase = function(id) {
  const form = document.querySelector('.modal-body');
  const data = {};
  form.querySelectorAll('[name]').forEach(el => {
    if (el.type === 'file') return;
    data[el.name] = el.value;
  });
  // 数值转换
  ['quantity','unitPrice','totalAmount','shelfLife'].forEach(k => { if (data[k]) data[k] = parseFloat(data[k]); });

  // 上传文件
  Object.keys(UI.uploadedFiles).forEach(key => {
    data[key] = UI.uploadedFiles[key];
  });

  if (!data.name) { toast('请填写食品名称', 'error'); return; }
  if (!data.purchaseDate) { toast('请选择进货日期', 'error'); return; }

  if (id) {
    DB.update('purchases', id, data);
    toast('进货记录已更新', 'success');
  } else {
    DB.add('purchases', data);
    toast('进货记录已添加', 'success');
    // 自动更新库存
    Pages._autoUpdateInventory(data);
  }
  UI.closeModal();
  Pages.purchases(document.getElementById('content'));
};

Pages._autoUpdateInventory = function(purchase) {
  const inv = DB.get('inventory', []);
  const existing = inv.find(i => i.name === purchase.name);
  if (existing) {
    existing.quantity = (existing.quantity || 0) + (purchase.quantity || 0);
    existing.purchasePrice = purchase.unitPrice || existing.purchasePrice;
    existing.lastPurchaseDate = purchase.purchaseDate;
    DB.save('inventory', inv);
  }
};

  UI.modal('进货记录详情', body, `<button class="btn btn-default" onclick="UI.closeModal()">关闭</button>`, 'lg');

};

/* ========== 供应商管理 ========== */
Pages.suppliers = function(container) {
  const suppliers = DB.get('suppliers', []);
  const purchases = DB.get('purchases', []);

  // 计算每个供应商今年采购总额
  const supplierStats = {};
  purchases.forEach(p => {
    if (p.supplier && new Date(p.purchaseDate).getFullYear() === new Date().getFullYear()) {
      if (!supplierStats[p.supplier]) supplierStats[p.supplier] = 0;
      supplierStats[p.supplier] += p.totalAmount || 0;

  });

  UI.renderListPage(container, {
    title: '🚚 供应商管理',
    addLabel: '新增供应商',
    data: suppliers,
    onAdd: "Pages._editSupplier()",
    onEdit: "Pages._editSupplier",
    onDelete: "Pages._deleteSupplier",
    columns: [
      { label: '供应商名称', key: 'name', render: r => `<span class="font-bold">${Utils.esc(r.name)}</span>` },
      { label: '联系人', key: 'contact' },
      { label: '电话', key: 'phone' },
      { label: '主营产品', key: 'mainProducts' },
      { label: '合作时间', key: 'cooperationDate' },
      { label: '结算方式', key: 'settlement' },
      { label: '付款周期', key: 'paymentCycle' },

    ]

Pages._editSupplier = function(id) {
  UI.resetUploads();
  const supplier = id ? DB.findById('suppliers', id) : {};
  const body = `
    <div class="form-row">
      ${UI.field('供应商名称', 'name', 'text', supplier.name || '', 'required')}
      ${UI.field('联系人', 'contact', 'text', supplier.contact || '')}

/* ========== 库存管理 ========== */
Pages.inventory = function(container) {
  const inv = DB.get('inventory', []);
  const categories = ['肉类','米粉','调料','饮料','包装盒','餐具','耗材','其他'];

  // 统计
  const totalValue = inv.reduce((s, i) => s + (i.quantity || 0) * (i.purchasePrice || 0), 0);
  const lowStockCount = inv.filter(i => i.safeStock && i.quantity <= i.safeStock).length;

  let html = `
    <div class="stat-grid">
      <div class="stat-card info"><div class="stat-icon">🏪</div><div class="stat-label">库存种类</div><div class="stat-value">${inv.length}<small> 种</small></div></div>
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">库存总金额</div><div class="stat-value">¥${Utils.money(totalValue)}</div></div>
      <div class="stat-card danger"><div class="stat-icon">⚠️</div><div class="stat-label">库存不足</div><div class="stat-value">${lowStockCount}<small> 项</small></div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">🏪 库存管理</div>
        <div>
          <button class="btn btn-default" onclick="Pages._stockInOut()">出入库</button>
          <button class="btn btn-primary" onclick="Pages._editInventory()">+ 新增库存</button>
        </div>
      </div>
      <div class="search-bar">
        <select id="invCatFilter" onchange="Pages._filterInventory(this.value)">
          <option value="">全部分类</option>
          ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
        <input type="text" id="invSearch" placeholder="搜索库存名称..." oninput="Pages._searchInventory(this.value)">
      </div>
  `;

  const searchKey = (container.dataset.invSearch || '').toLowerCase();
  const filterCat = container.dataset.invCat || '';
  let filtered = inv;
  if (searchKey) filtered = filtered.filter(i => i.name?.toLowerCase().includes(searchKey));
  if (filterCat) filtered = filtered.filter(i => i.category === filterCat);

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无库存数据</div></div>`;
  } else {
    html += `<div class="table-wrap"><table class="data-table"><thead><tr>
      <th>名称</th><th>分类</th><th>规格</th><th>库存数量</th><th>安全库存</th><th>状态</th>
      <th>库存金额</th><th>采购价</th><th>最近采购</th><th>最近出库</th><th>操作</th>
    </tr></thead><tbody>`;
    filtered.forEach(i => {
      const isLow = i.safeStock && i.quantity <= i.safeStock;
      const stockValue = (i.quantity || 0) * (i.purchasePrice || 0);
      html += `<tr>
        <td class="font-bold">${i.name || '-'}</td>
        <td><span class="badge badge-info">${i.category || '-'}</span></td>
        <td>${i.spec || '-'}</td>
        <td class="${isLow ? 'text-danger font-bold' : ''}">${i.quantity || 0} ${i.unit || ''}</td>
        <td>${i.safeStock || 0} ${i.unit || ''}</td>
        <td>${isLow ? '<span class="badge badge-danger">库存不足</span>' : '<span class="badge badge-success">正常</span>'}</td>
        <td>¥${Utils.money(stockValue)}</td>
        <td>¥${Utils.money(i.purchasePrice || 0)}</td>
        <td>${i.lastPurchaseDate || '-'}</td>
        <td>${i.lastOutDate || '-'}</td>
        <td>
          <button class="btn btn-default btn-sm" onclick="Pages._editInventory(${i.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="Pages._deleteInventory(${i.id})">删除</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }

  html += '</div>';
  container.innerHTML = html;
};

Pages._stockInOut = function() {

  const body = `
    <div class="form-group">

      <input type="number" class="form-control" name="amount" step="0.01" placeholder="输入数量">

Pages._doStockInOut = function() {
  const form = document.querySelector('.modal-body');
  const itemId = parseInt(form.querySelector('[name="itemId"]').value);
  const type = form.querySelector('[name="type"]').value;
  const amount = parseFloat(form.querySelector('[name="amount"]').value) || 0;
  const remark = form.querySelector('[name="remark"]').value;

  if (amount <= 0) { toast('请输入有效数量', 'error'); return; }

  const item = DB.findById('inventory', itemId);
  if (!item) { toast('物品不存在', 'error'); return; }

  if (type === 'in') {
    item.quantity = (item.quantity || 0) + amount;
    item.lastPurchaseDate = Utils.today();
  } else {
    if (item.quantity < amount) { toast('库存不足', 'error'); return; }
    item.quantity = (item.quantity || 0) - amount;
    item.lastOutDate = Utils.today();
  }
  DB.update('inventory', itemId, item);
  toast(`${type === 'in' ? '入库' : '出库'}成功，当前库存: ${item.quantity}${item.unit || ''}`, 'success');
  UI.closeModal();
  Pages.inventory(document.getElementById('content'));
  App.updateAlertBadge();
};

/* ========== 采购计划 ========== */
Pages.purchasePlan = function(container) {
  const inv = DB.get('inventory', []);

  // 自动生成采购清单：库存低于安全库存
  const needPurchase = inv.filter(i => i.safeStock && i.quantity <= i.safeStock).map(i => {
    const suggestQty = Math.max(i.safeStock * 2 - i.quantity, i.safeStock);
    return {
      ...i,
      suggestQty: Math.ceil(suggestQty * 10) / 10,
      suggestAmount: suggestQty * (i.purchasePrice || 0)
    };
  });

  // 即将过期的食品也需要重新采购
  const purchases = DB.get('purchases', []);
  const expiringItems = purchases.filter(p => {
    if (!p.expiryDate) return false;
    const days = Utils.daysBetween(Utils.today(), p.expiryDate);
    return days >= 0 && days <= 3;
  });

  const totalSuggestAmount = needPurchase.reduce((s, i) => s + i.suggestAmount, 0);

  let html = `
    <div class="stat-grid">
      <div class="stat-card danger"><div class="stat-icon">📦</div><div class="stat-label">需采购物品</div><div class="stat-value">${needPurchase.length}<small> 项</small></div></div>
      <div class="stat-card warning"><div class="stat-icon">⏰</div><div class="stat-label">即将过期</div><div class="stat-value">${expiringItems.length}<small> 项</small></div></div>
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">预计采购金额</div><div class="stat-value">¥${Utils.money(totalSuggestAmount)}</div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📋 采购计划（自动生成）</div>
        <button class="btn btn-success" onclick="Pages._exportPurchasePlan()">📋 导出采购清单</button>
      </div>
      <div class="text-muted text-sm mb-3">系统根据库存安全线自动生成采购建议，建议采购量 = 安全库存 × 2 - 当前库存</div>
  `;

  if (needPurchase.length === 0 && expiringItems.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">库存充足，暂无采购需求</div></div>`;
  } else {
    if (needPurchase.length > 0) {
      html += '<div class="section-title">📦 库存不足，建议采购</div>';
      html += `<div class="table-wrap"><table class="data-table"><thead><tr>
        <th>物品名称</th><th>分类</th><th>当前库存</th><th>安全库存</th><th>建议采购量</th><th>采购单价</th><th>预计金额</th><th>供应商</th>
      </tr></thead><tbody>`;
      needPurchase.forEach(i => {
        html += `<tr>
          <td class="font-bold">${i.name}</td>
          <td><span class="badge badge-info">${i.category || '-'}</span></td>
          <td class="text-danger font-bold">${i.quantity} ${i.unit || ''}</td>
          <td>${i.safeStock} ${i.unit || ''}</td>
          <td class="text-success font-bold">${i.suggestQty} ${i.unit || ''}</td>
          <td>¥${Utils.money(i.purchasePrice || 0)}</td>
          <td class="font-bold text-primary">¥${Utils.money(i.suggestAmount)}</td>
          <td>${i.supplier || '-'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }

    if (expiringItems.length > 0) {
      html += '<div class="section-title">⏰ 食品即将过期，建议补货</div>';
      html += `<div class="table-wrap"><table class="data-table"><thead><tr>
        <th>食品名称</th><th>剩余数量</th><th>到期日期</th><th>剩余天数</th><th>建议</th>
      </tr></thead><tbody>`;
      expiringItems.forEach(p => {
        const days = Utils.daysBetween(Utils.today(), p.expiryDate);
        html += `<tr>
          <td class="font-bold">${p.name}</td>
          <td>${p.quantity} ${p.unit || ''}</td>
          <td>${p.expiryDate}</td>
          <td><span class="badge ${days <= 1 ? 'badge-danger' : 'badge-warning'}">${days}天</span></td>
          <td class="text-muted">尽快使用或补充库存</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }
  }

  html += '</div>';
  container.innerHTML = html;
};

Pages._exportPurchasePlan = function() {
  const inv = DB.get('inventory', []);
  const needPurchase = inv.filter(i => i.safeStock && i.quantity <= i.safeStock).map(i => ({
    ...i,
    suggestQty: Math.max(i.safeStock * 2 - i.quantity, i.safeStock),
  }));
  const headers = ['物品名称','分类','当前库存','安全库存','建议采购量','单位','采购单价','预计金额','供应商'];
  const rows = needPurchase.map(i => [i.name, i.category, i.quantity, i.safeStock, Math.ceil(i.suggestQty*10)/10, i.unit, i.purchasePrice, (i.suggestQty * (i.purchasePrice||0)).toFixed(2), i.supplier]);
  Utils.exportCSV(`采购计划_${Utils.today()}.csv`, headers, rows);
  toast('采购清单已导出', 'success');
};

Pages._productRows = [];
Pages._addProductRow = function(name = '', qty = '') {

    </div>
  `).join('');
};

Pages._updateProductRow = function(idx, field, val) {
  if (Pages._productRows[idx]) {
    if (field === 'name') Pages._productRows[idx].name = val;

/* ========== 利润分析 ========== */
Pages.profit = function(container) {
  const sales = DB.get('dailySales', []);
  const expenses = DB.get('expenses', []);
  const purchases = DB.get('purchases', []);
  const now = new Date();

  // 本月数据
  const monthSales = sales.filter(s => Utils.isThisMonth(s.date));
  const monthRevenue = monthSales.reduce((s, x) => s + (x.totalRevenue || 0), 0);
  const monthExp = expenses.filter(e => Utils.isThisMonth(e.date));
  const monthExpTotal = monthExp.reduce((s, e) => s + (e.amount || 0), 0);
  const monthPurchases = purchases.filter(p => Utils.isThisMonth(p.purchaseDate));
  const monthPurchaseTotal = monthPurchases.reduce((s, p) => s + (p.totalAmount || 0), 0);

  // 分类统计
  const expByCat = {};
  monthExp.forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + (e.amount || 0); });

  const grossProfit = monthRevenue * 0.65;
  const netProfit = grossProfit - monthExpTotal;
  const costRate = monthRevenue > 0 ? ((monthExpTotal + monthPurchaseTotal) / monthRevenue * 100) : 0;

  const employees = DB.get('employees', []);
  const laborCost = expByCat['工资'] || employees.reduce((s, e) => s + (e.salary || 0), 0);
  const rent = expByCat['房租'] || 0;
  const utility = (expByCat['水电'] || 0) + (expByCat['燃气'] || 0);
  const ingredient = monthPurchaseTotal;
  const packaging = expByCat['办公用品'] || 0;
  const promotion = (expByCat['平台推广'] || 0) + (expByCat['广告'] || 0);

  const pct = (val) => monthRevenue > 0 ? (val / monthRevenue * 100).toFixed(1) : '0';

  let html = `
    <div class="section-title">📆 本月利润分析 (${now.getFullYear()}年${now.getMonth()+1}月)</div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">营业额</div><div class="stat-value">¥${Utils.money(monthRevenue)}</div></div>
      <div class="stat-card success"><div class="stat-icon">📈</div><div class="stat-label">毛利润</div><div class="stat-value">¥${Utils.money(grossProfit)}</div></div>
      <div class="stat-card ${netProfit >= 0 ? 'primary' : 'danger'}"><div class="stat-icon">💎</div><div class="stat-label">净利润</div><div class="stat-value">¥${Utils.money(netProfit)}</div></div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">📊 成本占比分析</div></div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>项目</th><th>金额</th><th>占营业额比例</th><th>可视化</th></tr></thead>
        <tbody>
          <tr><td class="font-bold">🥩 食材成本</td><td>¥${Utils.money(ingredient)}</td><td>${pct(ingredient)}%</td><td><div class="progress" style="width:200px;"><div class="progress-bar" style="width:${Math.min(pct(ingredient),100)}%;background:#E63946;"></div></div></td></tr>
          <tr><td class="font-bold">👥 人工成本</td><td>¥${Utils.money(laborCost)}</td><td>${pct(laborCost)}%</td><td><div class="progress" style="width:200px;"><div class="progress-bar" style="width:${Math.min(pct(laborCost),100)}%;background:#F77F00;"></div></div></td></tr>
          <tr><td class="font-bold">🏠 房租</td><td>¥${Utils.money(rent)}</td><td>${pct(rent)}%</td><td><div class="progress" style="width:200px;"><div class="progress-bar" style="width:${Math.min(pct(rent),100)}%;background:#118AB2;"></div></div></td></tr>
          <tr><td class="font-bold">⚡ 水电燃气</td><td>¥${Utils.money(utility)}</td><td>${pct(utility)}%</td><td><div class="progress" style="width:200px;"><div class="progress-bar" style="width:${Math.min(pct(utility),100)}%;background:#FFD166;"></div></div></td></tr>
          <tr><td class="font-bold">📦 包装耗材</td><td>¥${Utils.money(packaging)}</td><td>${pct(packaging)}%</td><td><div class="progress" style="width:200px;"><div class="progress-bar" style="width:${Math.min(pct(packaging),100)}%;background:#06D6A0;"></div></div></td></tr>
          <tr><td class="font-bold">📢 推广</td><td>¥${Utils.money(promotion)}</td><td>${pct(promotion)}%</td><td><div class="progress" style="width:200px;"><div class="progress-bar" style="width:${Math.min(pct(promotion),100)}%;background:#8338EC;"></div></div></td></tr>
          <tr><td class="font-bold text-danger">💸 总成本</td><td class="font-bold text-danger">¥${Utils.money(monthExpTotal + monthPurchaseTotal)}</td><td class="font-bold text-danger">${pct(monthExpTotal + monthPurchaseTotal)}%</td><td></td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">📈 近30天利润走势</div></div>
      <div class="chart-container" style="height:300px;"><canvas id="profitChart"></canvas></div>
    </div>
  `;
  container.innerHTML = html;

  setTimeout(() => {
    const canvas = container.querySelector('#profitChart');
    if (!canvas) return;
    const days = [];
    const today = new Date();
    for (let i = 29; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      days.push(Utils.formatDate(d));
    }
    const revData = days.map(d => sales.filter(s => s.date === d).reduce((s, x) => s + (x.totalRevenue || 0), 0));
    const grossData = revData.map(r => r * 0.65);
    const netData = days.map((d, i) => grossData[i] - expenses.filter(e => e.date === d).reduce((s, e) => s + (e.amount || 0), 0));

    App.chartInstances.profit = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: days.map(d => d.substring(5)),
        datasets: [
          { label: '营业额', data: revData, borderColor: '#E63946', backgroundColor: 'rgba(230,57,70,0.1)', tension: 0.3 },
          { label: '毛利润', data: grossData, borderColor: '#FFD166', backgroundColor: 'rgba(255,209,102,0.1)', tension: 0.3 },
          { label: '净利润', data: netData, borderColor: '#06D6A0', backgroundColor: 'rgba(6,214,160,0.1)', tension: 0.3, fill: true }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } } }
    });
  }, 50);
};

/* ========== 现金流 ========== */
Pages.cashflow = function(container) {
  const sales = DB.get('dailySales', []);
  const expenses = DB.get('expenses', []);
  const incomes = DB.get('incomes', []);

  // 今日收支
  const todayRevenue = sales.filter(s => Utils.isToday(s.date)).reduce((s, x) => s + (x.totalRevenue || 0), 0);
  const todayIncome = incomes.filter(i => Utils.isToday(i.date)).reduce((s, i) => s + (i.amount || 0), 0);
  const todayExpense = expenses.filter(e => Utils.isToday(e.date)).reduce((s, e) => s + (e.amount || 0), 0);
  const todayIn = todayRevenue + todayIncome;
  const todayOut = todayExpense;

  // 账户余额（从现金流账户表获取）
  const accounts = DB.get('cashflow', []);
  let cashBalance = 0, wechatBalance = 0, alipayBalance = 0, bankBalance = 0;
  if (accounts.length > 0) {
    const acc = accounts[0];
    cashBalance = acc.cash || 0;
    wechatBalance = acc.wechat || 0;
    alipayBalance = acc.alipay || 0;
    bankBalance = acc.bank || 0;
  }
  const totalBalance = cashBalance + wechatBalance + alipayBalance + bankBalance;

  // 月底预测
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const dayOfMonth = now.getDate();
  const monthRevenue = sales.filter(s => Utils.isThisMonth(s.date)).reduce((s, x) => s + (x.totalRevenue || 0), 0);
  const monthExpense = expenses.filter(e => Utils.isThisMonth(e.date)).reduce((s, e) => s + (e.amount || 0), 0);
  const avgDailyRevenue = dayOfMonth > 0 ? monthRevenue / dayOfMonth : 0;
  const avgDailyExpense = dayOfMonth > 0 ? monthExpense / dayOfMonth : 0;
  const remainingDays = daysInMonth - dayOfMonth;
  const projectedMonthEnd = totalBalance + (avgDailyRevenue * 0.65 - avgDailyExpense) * remainingDays;

  let html = `
    <div class="section-title">📅 今日现金流</div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card success"><div class="stat-icon">📥</div><div class="stat-label">今日收入</div><div class="stat-value">¥${Utils.money(todayIn)}</div></div>
      <div class="stat-card danger"><div class="stat-icon">📤</div><div class="stat-label">今日支出</div><div class="stat-value">¥${Utils.money(todayOut)}</div></div>
      <div class="stat-card primary"><div class="stat-icon">💰</div><div class="stat-label">今日净流入</div><div class="stat-value">¥${Utils.money(todayIn - todayOut)}</div></div>
    </div>

    <div class="section-title">🏦 账户余额</div>
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">

      <div class="stat-card success"><div class="stat-icon">💚</div><div class="stat-label">微信余额</div><div class="stat-value">¥${Utils.money(wechatBalance)}</div></div>

Pages._generateReport = function() {
  const type = document.getElementById('reportType').value;
  const dateStr = document.getElementById('reportDate').value;
  const date = new Date(dateStr);
  const sales = DB.get('dailySales', []);
  const expenses = DB.get('expenses', []);
  const purchases = DB.get('purchases', []);
  const incomes = DB.get('incomes', []);

  let start, end, title;
  if (type === 'daily') {
    start = end = new Date(dateStr);
    title = `日报（${dateStr}）`;
  } else if (type === 'weekly') {
    const day = date.getDay() || 7;
    start = new Date(date); start.setDate(date.getDate() - day + 1);
    end = new Date(start); end.setDate(start.getDate() + 6);
    title = `周报（${Utils.formatDate(start)} ~ ${Utils.formatDate(end)}）`;
  } else if (type === 'monthly') {
    start = new Date(date.getFullYear(), date.getMonth(), 1);
    end = new Date(date.getFullYear(), date.getMonth() + 1, 0);
    title = `月报（${date.getFullYear()}年${date.getMonth()+1}月）`;
  } else if (type === 'quarterly') {
    const q = Math.floor(date.getMonth() / 3);
    start = new Date(date.getFullYear(), q * 3, 1);
    end = new Date(date.getFullYear(), q * 3 + 3, 0);
    title = `季报（${date.getFullYear()}年Q${q+1}）`;
  } else {
    start = new Date(date.getFullYear(), 0, 1);
    end = new Date(date.getFullYear(), 11, 31);
    title = `年报（${date.getFullYear()}年）`;
  }

  const sStr = Utils.formatDate(start), eStr = Utils.formatDate(end);
  const periodSales = sales.filter(s => s.date >= sStr && s.date <= eStr);
  const periodExp = expenses.filter(e => e.date >= sStr && e.date <= eStr);
  const periodPur = purchases.filter(p => p.purchaseDate >= sStr && p.purchaseDate <= eStr);
  const periodInc = incomes.filter(i => i.date >= sStr && i.date <= eStr);

  const revenue = periodSales.reduce((s, x) => s + (x.totalRevenue || 0), 0);
  const expTotal = periodExp.reduce((s, e) => s + (e.amount || 0), 0);
  const purchaseTotal = periodPur.reduce((s, p) => s + (p.totalAmount || 0), 0);
  const incomeTotal = periodInc.reduce((s, i) => s + (i.amount || 0), 0);
  const grossProfit = revenue * 0.65;
  const netProfit = grossProfit - expTotal;

  // 支出分类
  const expByCat = {};
  periodExp.forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + (e.amount || 0); });

  // 平台
  const platformData = {};
  periodSales.forEach(s => {
    ['美团','淘宝','京东','堂食'].forEach((p, i) => {
      const keys = ['meituan','taobao','jd','dineIn'];
      platformData[p] = (platformData[p] || 0) + (s[keys[i]] || 0);
    });
  });

  const result = document.getElementById('reportResult');
  result.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 ${title}</div>
        <div>
          <button class="btn btn-default btn-sm" onclick="Pages._exportReport('${title}')">📋 导出CSV</button>
          <button class="btn btn-default btn-sm" onclick="Pages._printReport('${title}')">🖨️ 打印</button>
        </div>
      </div>
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card primary"><div class="stat-label">营业额</div><div class="stat-value">¥${Utils.money(revenue)}</div></div>
        <div class="stat-card success"><div class="stat-label">毛利润</div><div class="stat-value">¥${Utils.money(grossProfit)}</div></div>
        <div class="stat-card ${netProfit >= 0 ? 'primary' : 'danger'}"><div class="stat-label">净利润</div><div class="stat-value">¥${Utils.money(netProfit)}</div></div>
        <div class="stat-card warning"><div class="stat-label">总支出</div><div class="stat-value">¥${Utils.money(expTotal + purchaseTotal)}</div></div>
      </div>

      <div class="section-title">💰 收入明细</div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>项目</th><th>金额</th></tr></thead>
        <tbody>
          <tr><td>营业额</td><td class="text-success font-bold">¥${Utils.money(revenue)}</td></tr>
          <tr><td>其他收入</td><td class="text-success">¥${Utils.money(incomeTotal)}</td></tr>
          <tr><td class="font-bold">总收入</td><td class="font-bold text-success">¥${Utils.money(revenue + incomeTotal)}</td></tr>
        </tbody>
      </table></div>

      <div class="section-title">💸 支出明细</div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>分类</th><th>金额</th><th>占比</th></tr></thead>
        <tbody>
          ${Object.entries(expByCat).sort((a,b) => b[1]-a[1]).map(([cat, amt]) => `
            <tr><td>${cat}</td><td class="text-danger">¥${Utils.money(amt)}</td><td>${expTotal > 0 ? (amt/expTotal*100).toFixed(1) : 0}%</td></tr>
          `).join('')}
          <tr><td>食材采购</td><td class="text-danger">¥${Utils.money(purchaseTotal)}</td><td>-</td></tr>
          <tr><td class="font-bold">总支出</td><td class="font-bold text-danger">¥${Utils.money(expTotal + purchaseTotal)}</td><td>100%</td></tr>
        </tbody>
      </table></div>

      <div class="section-title">📱 平台收入分布</div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>平台</th><th>金额</th><th>占比</th></tr></thead>
        <tbody>
          ${Object.entries(platformData).filter(([k,v]) => v > 0).map(([p, amt]) => `
            <tr><td>${p}</td><td>¥${Utils.money(amt)}</td><td>${revenue > 0 ? (amt/revenue*100).toFixed(1) : 0}%</td></tr>
          `).join('') || '<tr><td colspan="3" class="text-center text-muted">暂无数据</td></tr>'}
        </tbody>
      </table></div>

      <div class="section-title">📋 现金流摘要</div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>项目</th><th>金额</th></tr></thead>
        <tbody>
          <tr><td>现金流入（营业+其他收入）</td><td class="text-success">¥${Utils.money(revenue + incomeTotal)}</td></tr>
          <tr><td>现金流出（支出+采购）</td><td class="text-danger">¥${Utils.money(expTotal + purchaseTotal)}</td></tr>
          <tr><td class="font-bold">净现金流</td><td class="font-bold ${revenue + incomeTotal - expTotal - purchaseTotal >= 0 ? 'text-success' : 'text-danger'}">¥${Utils.money(revenue + incomeTotal - expTotal - purchaseTotal)}</td></tr>
        </tbody>
      </table></div>
    </div>
  `;
};

Pages._exportReport = function(title) {
  const sales = DB.get('dailySales', []);
  const expenses = DB.get('expenses', []);
  const purchases = DB.get('purchases', []);
  const type = document.getElementById('reportType').value;
  const dateStr = document.getElementById('reportDate').value;
  const date = new Date(dateStr);
  let start, end;
  if (type === 'daily') { start = end = new Date(dateStr); }
  else if (type === 'weekly') { const day = date.getDay()||7; start = new Date(date); start.setDate(date.getDate()-day+1); end = new Date(start); end.setDate(start.getDate()+6); }
  else if (type === 'monthly') { start = new Date(date.getFullYear(), date.getMonth(), 1); end = new Date(date.getFullYear(), date.getMonth()+1, 0); }
  else if (type === 'quarterly') { const q = Math.floor(date.getMonth()/3); start = new Date(date.getFullYear(), q*3, 1); end = new Date(date.getFullYear(), q*3+3, 0); }
  else { start = new Date(date.getFullYear(),0,1); end = new Date(date.getFullYear(),11,31); }
  const sStr = Utils.formatDate(start), eStr = Utils.formatDate(end);
  const revenue = sales.filter(s => s.date >= sStr && s.date <= eStr).reduce((s, x) => s + (x.totalRevenue || 0), 0);
  const expTotal = expenses.filter(e => e.date >= sStr && e.date <= eStr).reduce((s, e) => s + (e.amount || 0), 0);
  const purchaseTotal = purchases.filter(p => p.purchaseDate >= sStr && p.purchaseDate <= eStr).reduce((s, p) => s + (p.totalAmount || 0), 0);
  Utils.exportCSV(`${title}.csv`, ['项目','金额'], [['营业额',revenue],['毛利润',revenue*0.65],['总支出',expTotal+purchaseTotal],['净利润',revenue*0.65-expTotal]]);
  toast('报表已导出', 'success');
};

Pages._printReport = function(title) {
  const content = document.getElementById('reportResult').innerHTML;
  Utils.print(`<h2>花小小新疆炒米粉 - ${title}</h2><p>生成时间: ${Utils.formatDateTime(new Date())}</p>${content}`);
};

Pages.employees = function(container) {

    <div class="stat-grid">

      <div class="stat-card danger"><div class="stat-icon">⚠️</div><div class="stat-label">健康证过期/将过期</div><div class="stat-value">${employees.filter(e => e.healthCertExpiry && Utils.daysBetween(Utils.today(), e.healthCertExpiry) <= 30).length}<small> 人</small></div></div>
    </div>
  `;

  UI.renderListPage(container, {
    title: '👥 员工管理',

    onEdit: "Pages._editEmployee",
    onDelete: "Pages._deleteEmployee",

      { label: '姓名', key: 'name', render: r => `<span class="font-bold">${Utils.esc(r.name)}</span>` },

Pages.foodSafety = function(container) {

      <div class="card-header">
        <div class="card-title">🛡️ 食品安全台账 - 今日(${today})完成情况</div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px;">

          const done = completedTypes.includes(t);

            <div style="font-size:20px;">${done ? '✅' : '⏰'}</div>
            <div style="font-size:12px;font-weight:600;margin-top:4px;">${t}</div>
            <div style="font-size:11px;color:${done ? '#155724' : '#856404'};">${done ? '已完成' : '待完成'}</div>
          </div>`;
        }).join('')}
      </div>

  else { DB.add('badReviews', data); toast('差评已添加', 'success'); }
  UI.closeModal();
  Pages.badReviews(document.getElementById('content'));
};

Pages._deleteBadReview = function(id) {
  UI.confirm('确定删除这条差评记录吗？', () => {
    DB.remove('badReviews', id);
    toast('已删除', 'success');
    Pages.badReviews(document.getElementById('content'));
  });
};

      platformData['淘宝'] = (platformData['淘宝'] || 0) + (s.taobao || 0);
      platformData['京东'] = (platformData['京东'] || 0) + (s.jd || 0);
      platformData['堂食'] = (platformData['堂食'] || 0) + (s.dineIn || 0);

    const topProducts = Object.entries(productSales).sort((a,b) => b[1]-a[1]).slice(0, 15);

      }).join('') + '</ul>';
    }

    // 客单价变化
    const avgPriceData = days.map(d => {
      const s = sales.filter(x => x.date === d);
      const rev = s.reduce((sum, x) => sum + (x.totalRevenue || 0), 0);
      const orders = s.reduce((sum, x) => sum + (x.orderCount || 0), 0);
      return orders > 0 ? rev / orders : 0;
    });
    App.chartInstances.statAvgPrice = new Chart(container.querySelector('#statAvgPriceChart').getContext('2d'), {
      type: 'line',
      data: { labels: days.map(d => d.substring(5)), datasets: [{ label: '客单价', data: avgPriceData, borderColor: '#F77F00', backgroundColor: 'rgba(247,127,0,0.1)', fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } } }
    });

    // 库存走势（当前库存量）
    const inv = DB.get('inventory', []);
    if (inv.length > 0) {
      App.chartInstances.statInv = new Chart(container.querySelector('#statInventoryChart').getContext('2d'), {
        type: 'bar',
        data: { labels: inv.map(i => i.name), datasets: [{ label: '当前库存', data: inv.map(i => i.quantity || 0), backgroundColor: 'rgba(42,157,143,0.7)' }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true },
            x: { ticks: { autoSkip: false, maxRotation: 45, minRotation: 30, font: { size: 10 } } }
          }
        }
      });
    }
  }, 50);
};
